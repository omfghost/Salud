<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Fondo redondeado -->
  <rect width="512" height="512" fill="url(#mainGrad)" rx="100"/>
  
  <!-- Sombra interna -->
  <rect width="512" height="512" fill="rgba(0,0,0,0.1)" rx="100"/>
  
  <!-- Pulso del corazón (Heartbeat line) -->
  <g transform="translate(256, 180)">
    <!-- Línea ECG -->
    <polyline points="-120,0 -80,0 -60,-40 -40,40 -20,0 20,0 40,-20 60,20 80,0 120,0" 
              stroke="white" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Corazón -->
  <g transform="translate(256, 300)">
    <path d="M 0,-30 C -40,-70 -80,-50 -80,0 C -80,40 -40,80 0,110 C 40,80 80,40 80,0 C 80,-50 40,-70 0,-30 Z" 
          fill="white" opacity="0.9"/>
  </g>
  
  <!-- Texto: H -->
  <text x="256" y="450" font-family="Sora, sans-serif" font-size="120" font-weight="bold" 
        text-anchor="middle" fill="white" opacity="0.95">H</text>
  
  <!-- Texto pequeño: HEALTH -->
  <text x="256" y="500" font-family="Sora, sans-serif" font-size="36" font-weight="600" 
        text-anchor="middle" fill="white" opacity="0.8" letter-spacing="4">HEALTH</text>
  
  <!-- Borde sutil -->
  <rect width="512" height="512" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" rx="100"/>
</svg>
