<script>
const DEFAULT_WIDGETS=['health_status','weight','sleep_hrv','sleep_hrv_avg','sleep_hours','sleep_score','fasting_last','vo2max','meditation_last','activity_last','waist'];
const DEFAULT_SPORTS=[{id:'crossfit',name:'CrossFit'},{id:'carrera',name:'Carrera'},{id:'piscina',name:'Piscina'}];
const SPORT_COLOR_PALETTE=['#a7f3d0','#fbbf24','#60a5fa','#f87171','#c084fc','#34d399','#fb923c','#38bdf8','#f472b6','#a3e635'];
function sportColor(sportId){
  // Fixed colors for defaults, hashed for custom
  const fixed={crossfit:'#fbbf24',carrera:'#60a5fa',piscina:'#38bdf8'};
  if(fixed[sportId])return fixed[sportId];
  let hash=0;const s=String(sportId);
  for(let i=0;i<s.length;i++)hash=s.charCodeAt(i)+((hash<<5)-hash);
  return SPORT_COLOR_PALETTE[Math.abs(hash)%SPORT_COLOR_PALETTE.length];
}
const WEATHER_PRESETS={
  soleado:{name:'Soleado',icon:'☀️',uvMult:1.0,uvbMult:1.0},
  parcial:{name:'Parcial',icon:'⛅',uvMult:0.75,uvbMult:0.70},

};
const SKIN_TYPES={

  V:{name:'V',desc:'Oscura, bronceado intenso',mult:0.5},
  VI:{name:'VI',desc:'Muy oscura',mult:0.35}
};
const CLOTHING_LEVELS={
  swimsuit:{name:'Bañador',icon:'🩱',exposure:0.85,skinPct:80},
  shorts:{name:'Camiseta + short',icon:'👕',exposure:0.45,skinPct:40},
  light:{name:'Manga corta',icon:'👔',exposure:0.25,skinPct:25},
  long:{name:'Manga larga',icon:'🧥',exposure:0.10,skinPct:10},
  covered:{name:'Cubierto',icon:'🧣',exposure:0.05,skinPct:5}
};
const DAY_NAMES=[
  {id:'monday',name:'Lunes',short:'LUN'},
  {id:'tuesday',name:'Martes',short:'MAR'},
  {id:'wednesday',name:'Miércoles',short:'MIÉ'},

];
const DEFAULT_ESTADO_ORDER=['fasting','sleep','body','allergy','vo2','light','health'];

const store={
  sleep:JSON.parse(localStorage.getItem('h_sleep')||'[]'),
  activity:JSON.parse(localStorage.getItem('h_activity')||'[]'),
  weight:JSON.parse(localStorage.getItem('h_weight')||'[]'),

  meditation:JSON.parse(localStorage.getItem('h_meditation')||'[]'),
  programs:JSON.parse(localStorage.getItem('h_programs')||'null')||[
    {id:1,name:'4:6 Nervio vago (HRV)',total:300,inhale:4,exhale:6,countdown:3},
    {id:2,name:'4:4 Coherencia cardíaca',total:300,inhale:4,exhale:4,countdown:3},
    {id:3,name:'4:7:8 Relajación profunda',total:240,inhale:4,exhale:8,countdown:3},
    {id:4,name:'6:6 Calma (5,5 rpm)',total:360,inhale:6,exhale:6,countdown:3},
    {id:5,name:'5:5 Equilibrio',total:300,inhale:5,exhale:5,countdown:3}
  ],

// ============ VIDEO STORAGE (IndexedDB) ============
// Videos can be large (iPhone clips >1min), which overflows localStorage's ~5MB quota.
// We store video blobs in IndexedDB and keep only a reference id ("idb:...") in the record.
let _videoDB=null;
function openVideoDB(){
  return new Promise(function(resolve,reject){
    if(_videoDB){resolve(_videoDB);return;}
    try{
      const req=indexedDB.open('health_videos',1);
      req.onupgradeneeded=function(e){
        const db=e.target.result;
        if(!db.objectStoreNames.contains('videos'))db.createObjectStore('videos');
      };
      req.onsuccess=function(e){_videoDB=e.target.result;resolve(_videoDB);};
      req.onerror=function(){reject(req.error);};
    }catch(e){reject(e);}
  });
}
function saveVideoBlob(blob){
  return openVideoDB().then(function(db){
    return new Promise(function(resolve,reject){
      const id='idb:'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
      const tx=db.transaction('videos','readwrite');
      tx.objectStore('videos').put(blob,id);
      tx.oncomplete=function(){resolve(id);};
      tx.onerror=function(){reject(tx.error);};
    });
  });
}
function getVideoURL(ref){
  // Returns Promise<objectURL|null>. Handles new idb refs and legacy base64 strings.
  if(!ref)return Promise.resolve(null);
  if(ref.indexOf('idb:')!==0)return Promise.resolve(ref);
  return openVideoDB().then(function(db){
    return new Promise(function(resolve){
      const tx=db.transaction('videos','readonly');
      const rq=tx.objectStore('videos').get(ref);
      rq.onsuccess=function(){resolve(rq.result?URL.createObjectURL(rq.result):null);};
      rq.onerror=function(){resolve(null);};
    });
  });
}
function deleteVideoBlob(ref){
  if(!ref||ref.indexOf('idb:')!==0)return Promise.resolve();
  return openVideoDB().then(function(db){
    return new Promise(function(resolve){
      const tx=db.transaction('videos','readwrite');
      tx.objectStore('videos').delete(ref);
      tx.oncomplete=function(){resolve();};
      tx.onerror=function(){resolve();};
    });
  });
}

// Show specific glossary term as modal popup
function showTerm(key){
  if(!key)return;
  let t=GLOSSARY[key];
  // Try a case-insensitive lookup as fallback
  if(!t){
    const lkey=key.toLowerCase().replace(/\s+/g,'');
    for(const k in GLOSSARY){
      if(k.toLowerCase().replace(/\s+/g,'')===lkey){t=GLOSSARY[k];break;}
    }
  }
  if(!t){
    // open general glossary with search prefilled
    openModal('glossary');
    const s=document.getElementById('glossarySearch');
    if(s){s.value=key;renderGlossary();}
    return;
  }
  const titleEl=document.getElementById('termTitle');
  const contentEl=document.getElementById('termContent');
  if(!titleEl||!contentEl){openModal('term');return;}
  titleEl.textContent=t.n;
  contentEl.innerHTML='<p style="margin-bottom:8px"><strong style="color:var(--accent)">¿Qué es?</strong> '+t.s+'</p><p style="margin-bottom:8px"><strong style="color:var(--accent)">Cómo se mide:</strong> '+t.o+'</p><p style="margin-bottom:8px"><strong style="color:var(--accent)">Cálculo:</strong> '+t.c+'</p><p><strong style="color:var(--accent)">Importancia:</strong> '+t.i+'</p>';
  openModal('term');
}

let audioCtx=null;
let bgNodes=null;

function getAudioCtx(){
  try{
    if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
    if(audioCtx.state==='suspended')audioCtx.resume();
    return audioCtx;
  }catch(e){return null;}
}
function unlockAudio(){
  return new Promise(function(resolve){
    try{
      const ctx=getAudioCtx();
      if(!ctx){resolve();return;}
      const rp=ctx.state==='suspended'?ctx.resume():Promise.resolve();
      rp.then(function(){
        try{const b=ctx.createBuffer(1,1,22050);const s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);s.start(0);}catch(e){}
        resolve();
      }).catch(function(){resolve();});
    }catch(e){resolve();}
  });
}
function playBell(volume){
  volume=volume!=null?volume:(store.settings.bellVolume!=null?store.settings.bellVolume:0.4);
  const ctx=getAudioCtx();if(!ctx)return;
  try{
    const now=ctx.currentTime;
    const bt=(typeof BELL_TYPES!=='undefined')?BELL_TYPES[store.settings.bellType||0]:{freq:523.25};
    const f=bt.freq;
    [{r:1,v:1,d:5},{r:2.756,v:0.5,d:4},{r:5.404,v:0.3,d:3},{r:8.933,v:0.2,d:2}].forEach(function(h){
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=f*h.r;o.type='sine';
      g.gain.setValueAtTime(0,now);
      g.gain.linearRampToValueAtTime(volume*h.v,now+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,now+h.d);
      o.start(now);o.stop(now+h.d+0.1);
    });
  }catch(e){}
}
function playChime(volume){
  volume=volume||0.25;
  const ctx=getAudioCtx();if(!ctx)return;
  try{
    const now=ctx.currentTime;
    [{r:1,v:1,d:2.5},{r:2.4,v:0.4,d:2},{r:4.2,v:0.2,d:1.5}].forEach(function(h){
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=659.25*h.r;o.type='sine';
      g.gain.setValueAtTime(0,now);
      g.gain.linearRampToValueAtTime(volume*h.v,now+0.008);
      g.gain.exponentialRampToValueAtTime(0.001,now+h.d);
      o.start(now);o.stop(now+h.d+0.1);
    });
  }catch(e){}
}
function playChimeLow(volume){
  volume=volume||0.25;
  const ctx=getAudioCtx();if(!ctx)return;
  try{
    const now=ctx.currentTime;
    [{r:1,v:1,d:2.8},{r:2.4,v:0.4,d:2.2},{r:4.2,v:0.2,d:1.5}].forEach(function(h){
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=440*h.r;o.type='sine';
      g.gain.setValueAtTime(0,now);
      g.gain.linearRampToValueAtTime(volume*h.v,now+0.008);
      g.gain.exponentialRampToValueAtTime(0.001,now+h.d);
      o.start(now);o.stop(now+h.d+0.1);

}
function startBgMusic(){
  stopBgMusic();
  const ctx=getAudioCtx();if(!ctx)return;
  try{
    const now=ctx.currentTime;
    const vol=(store.settings.musicVolume!=null?store.settings.musicVolume:0.5);
    const track=(typeof MUSIC_TRACKS!=='undefined')?MUSIC_TRACKS[store.settings.musicTrack||0]:{freqs:[110,164.81,220]};
    const master=ctx.createGain();
    master.gain.setValueAtTime(0,now);
    master.gain.linearRampToValueAtTime(vol*0.12,now+2);
    master.connect(ctx.destination);
    const oscs=[];
    track.freqs.forEach(function(f,i){
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(master);
      o.frequency.value=f;o.type=i===0?'sine':'triangle';
      g.gain.value=0.2/(i+1);
      o.start(now);
      oscs.push(o);
    });
    bgNodes={master:master,oscs:oscs};
  }catch(e){bgNodes=null;}
}
function stopBgMusic(){
  if(!bgNodes)return;
  const n=bgNodes;bgNodes=null;
  try{
    if(audioCtx&&n.master){
      const now=audioCtx.currentTime;
      try{n.master.gain.cancelScheduledValues(now);n.master.gain.setValueAtTime(n.master.gain.value||0.18,now);n.master.gain.linearRampToValueAtTime(0,now+0.8);}catch(e){}
      setTimeout(function(){n.oscs.forEach(function(o){try{o.stop();o.disconnect();}catch(e){}});try{n.master.disconnect();}catch(e){}},900);
    }
  }catch(e){n.oscs.forEach(function(o){try{o.stop();}catch(e){}});}
}

}

function calcSunTimes(lat,lng,date){
  const d=date||new Date();
  const dayOfYear=Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);
  const declination=-23.45*Math.cos(2*Math.PI*(dayOfYear+10)/365);
  const latRad=lat*Math.PI/180;
  const declRad=declination*Math.PI/180;
  const cosHA=-Math.tan(latRad)*Math.tan(declRad);
  let hourAngle=90;
  if(cosHA>=-1&&cosHA<=1)hourAngle=Math.acos(cosHA)*180/Math.PI;
  const tzOff=d.getTimezoneOffset()/-60;
  const sunrise=12-hourAngle/15-lng/15+tzOff;
  const sunset=12+hourAngle/15-lng/15+tzOff;
  const noon=(sunrise+sunset)/2;
  const dayLen=sunset-sunrise;
  return{sunrise:sunrise,sunset:sunset,noon:noon,uvbStart:sunrise+dayLen*0.30,uvbEnd:sunset-dayLen*0.30,uvaStart:sunrise+dayLen*0.08,uvaEnd:sunset-dayLen*0.08,goldenMorning:{start:sunrise,end:sunrise+dayLen*0.08},goldenEvening:{start:sunset-dayLen*0.08,end:sunset},blueMorning:{start:sunrise-0.5,end:sunrise},blueEvening:{start:sunset,end:sunset+0.5},dayLen:dayLen};
}

function uvIndex(hour,t,w){if(hour<t.sunrise||hour>t.sunset)return 0;const nd=Math.abs(hour-t.noon);const dl=(t.sunset-t.sunrise)/2;let uv=Math.max(0,Math.min(11,11*(1-Math.pow(nd/dl,2))));if(w){const wp=WEATHER_PRESETS[store.settings.weather||'soleado'];uv*=wp.uvMult;}return uv;}
function uvaIndex(hour,t,w){if(hour<t.uvaStart||hour>t.uvaEnd)return 0;const nd=Math.abs(hour-t.noon);const dl=(t.uvaEnd-t.uvaStart)/2;let v=Math.max(0,Math.min(11,11*(1-Math.pow(nd/dl,1.6))));if(w){const wp=WEATHER_PRESETS[store.settings.weather||'soleado'];v*=wp.uvMult;}return v;}
function uvbIndex(hour,t,w){if(hour<t.uvbStart||hour>t.uvbEnd)return 0;const nd=Math.abs(hour-t.noon);const dl=(t.uvbEnd-t.uvbStart)/2;let v=Math.max(0,Math.min(11,11*(1-Math.pow(nd/dl,1.4))));if(w){const wp=WEATHER_PRESETS[store.settings.weather||'soleado'];v*=wp.uvbMult;}return v;}

// Vit D considering skin type, clothing AND age
// Age factor: synthesis declines ~13% per decade after 20 (7-DHC depletion). 70yo makes ~25% of a 20yo.
function vitDAgeFactor(){
  const age=parseInt(store.settings.age||35);
  if(age<=20)return 1.0;
  const f=1.0-(age-20)*0.013;
  return Math.max(0.2,f);
}
function vitDPerMinute(uvb){
  if(uvb<=0)return 0;
  let base=uvb<=6?uvb*25:6*25+(uvb-6)*10;
  const skin=SKIN_TYPES[store.settings.skinType||'III'];
  const cloth=CLOTHING_LEVELS[store.settings.clothing||'shorts'];
  return base*skin.mult*cloth.exposure*vitDAgeFactor();
}

function getSkyColors(hour,t){
  if(!store.settings.sunEffects)return{outer:'#0a0a0a',inner:'#000'};
  const isDay=hour>=t.sunrise&&hour<=t.sunset;
  if(hour>=t.goldenMorning.start&&hour<=t.goldenMorning.end)return{outer:'rgba(251,146,60,0.35)',inner:'rgba(254,215,170,0.18)'};
  if(hour>=t.goldenEvening.start&&hour<=t.goldenEvening.end)return{outer:'rgba(220,38,38,0.32)',inner:'rgba(251,146,60,0.18)'};
  if(hour>=t.blueMorning.start&&hour<=t.blueMorning.end)return{outer:'rgba(99,102,241,0.32)',inner:'rgba(167,139,250,0.16)'};
  if(hour>=t.blueEvening.start&&hour<=t.blueEvening.end)return{outer:'rgba(124,58,237,0.35)',inner:'rgba(99,102,241,0.16)'};
  if(isDay){const np=1-Math.abs(hour-t.noon)/(t.dayLen/2);return{outer:'rgba(56,189,248,'+(0.14+np*0.16)+')',inner:'rgba(251,191,36,'+(0.08+np*0.14)+')'};}
  const m=hour<12?hour:24-hour;
  if(m<3)return{outer:'rgba(15,23,42,0.7)',inner:'rgba(2,6,23,0.4)'};
  return{outer:'rgba(30,41,59,0.5)',inner:'rgba(15,23,42,0.25)'};
}

// Get Monday's date of current week as YYYY-MM-DD
function getCurrentWeekStart(){
  const d=new Date();
  const day=d.getDay();
  // Monday-based: shift Sunday(0)->-6, others -> day-1
  const diff=day===0?-6:1-day;
  d.setDate(d.getDate()+diff);
  d.setHours(0,0,0,0);
  return d.toISOString().split('T')[0];
}

// Check if a new week started since last seen weekStart - if so, reset all 'done' flags
function checkWeeklyReset(){

}

  fasting_last:{name:'Último ayuno',icon:'🕐',section:'estado',get:function(){const f=store.fasting[store.fasting.length-1];return f?{val:fmtDuration(f.duration),unit:'',sub:fmtDate(f.date)}:null;}},
  fasting_avg:{name:'Ayuno medio mes',icon:'📉',section:'estado',get:function(){const v=avg(filterByRange(store.fasting,'1m'),'duration');return v>0?{val:fmtDuration(v),unit:'',sub:'30d'}:null;}},
  vo2max:{name:'VO2 Max',icon:'🫁',section:'estado',get:function(){return store.vo2max?{val:store.vo2max,unit:'',sub:'ml/kg/min'}:null;}},
  meditation_last:{name:'Última meditación',icon:'🧘',section:'meditacion',get:function(){const m=store.meditation[store.meditation.length-1];if(!m)return null;return{val:fmtTime(m.duration),unit:'',sub:fmtDate(m.date)+' · '+m.inhale+'/'+m.exhale+'s'};}},
  activity_last:{name:'Último entreno',icon:'🏋️',section:'actividad',get:function(){const a=store.activity[store.activity.length-1];if(!a)return null;const sp=store.sports.find(function(s){return s.id===a.type;});const name=sp?sp.name:a.type;const detail=[];if(a.subtype)detail.push(a.subtype);if(a.result)detail.push(a.result);else if(a.duration)detail.push(a.duration+'min');if(a.distance)detail.push(a.distance);return{val:name,unit:'',sub:(detail.join(' · ')||fmtDate(a.date))};}},
  activity_count:{name:'Entrenos mes',icon:'💪',section:'actividad',get:function(){const c=filterByRange(store.activity,'1m').length;return{val:c,unit:'',sub:'30 días'};}},
  waist:{name:'Cintura',icon:'📏',section:'estado',get:function(){const m=[].concat(store.measurements).reverse().find(function(x){return x.waist;});return m?{val:m.waist,unit:'cm',sub:fmtDate(m.date)}:null;}},
  chest:{name:'Pecho',icon:'📐',section:'estado',get:function(){const m=[].concat(store.measurements).reverse().find(function(x){return x.chest;});return m?{val:m.chest,unit:'cm',sub:fmtDate(m.date)}:null;}},
  vitd_total:{name:'Vit D mes',icon:'☀️',section:'sol',get:function(){const f=filterByRange(store.sun,'1m');if(!f.length)return null;const total=f.reduce(function(s,x){return s+(parseFloat(x.vitd)||0);},0);return{val:Math.round(total),unit:'IU',sub:'30 días'};}},
  health_status:{name:'Estado de salud (4 sem)',icon:'🩺',section:'estado',get:function(){if(typeof computeHealth!=='function')return null;const r=computeHealth(28);if(!r.hasData)return null;const rt=healthRating(r.composite);return{val:r.composite,unit:'/100',sub:rt.emoji+' '+rt.label};}}
};
</script>
<script>
function renderSunSVG(times,hour,uv,isDay,size,mini){
  const center=size/2;
  const padding=mini?8:34;
  const radius=center-padding;
  function h2a(h){return (h/24)*360-90;}
  function p2x(angle,r){const rad=angle*Math.PI/180;return{x:center+r*Math.cos(rad),y:center+r*Math.sin(rad)};}
  function arcP(s,e,r){
    const sa=h2a(s);const ea=h2a(e);
    const sp=p2x(sa,r);const ep=p2x(ea,r);
    const la=(e-s)>12?1:0;
    return 'M '+sp.x+' '+sp.y+' A '+r+' '+r+' 0 '+la+' 1 '+ep.x+' '+ep.y;
  }
  const sunAng=h2a(hour);
  const sunPos=p2x(sunAng,radius);
  const sky=getSkyColors(hour,times);

  // Day arc - segmented colored
  let dayArcs='';
  if(!mini){
    const segs=24;
    for(let i=0;i<segs;i++){
      const t1=i/segs,t2=(i+1)/segs;
      const h1=times.sunrise+t1*times.dayLen;
      const h2=times.sunrise+t2*times.dayLen;
      let col;
      if(t1<0.08)col='#fb923c';
      else if(t1<0.20)col='#fcd34d';
      else if(t1<0.40)col='#fde047';
      else if(t1<0.60)col='#fbbf24';
      else if(t1<0.78)col='#fb923c';
      else if(t1<0.92)col='#f97316';
      else col='#dc2626';
      dayArcs+='<path d="'+arcP(h1,h2,radius)+'" fill="none" stroke="'+col+'" stroke-width="6" stroke-linecap="butt" opacity="0.95"/>';
    }
  }else{
    dayArcs='<path d="'+arcP(times.sunrise,times.sunset,radius)+'" fill="none" stroke="url(#dayGradMini'+size+')" stroke-width="4" stroke-linecap="round" opacity="0.95"/>';
  }

  // Hour markers
  let hourMarkers='',hourTicks='';
  if(!mini){
    for(let h=0;h<24;h+=3){
      const a=h2a(h);
      const o=p2x(a,radius+12);
      const ii=p2x(a,radius+2);
      const tx=p2x(a,radius+24);
      hourMarkers+='<line x1="'+ii.x+'" y1="'+ii.y+'" x2="'+o.x+'" y2="'+o.y+'" stroke="#555" stroke-width="1.2"/>';
      hourMarkers+='<text x="'+tx.x+'" y="'+tx.y+'" fill="#888" font-size="10" text-anchor="middle" dominant-baseline="middle" font-family="Outfit" font-weight="500">'+(h<10?'0':'')+h+'</text>';
    }
    for(let h=0;h<24;h++){
      if(h%3===0)continue;
      const a=h2a(h);
      const o=p2x(a,radius+5);
      const ii=p2x(a,radius+2);
      hourTicks+='<line x1="'+ii.x+'" y1="'+ii.y+'" x2="'+o.x+'" y2="'+o.y+'" stroke="#333" stroke-width="0.6"/>';
    }
  }

  // UVA + UVB rings - UVB INSIDE UVA so they don't overlap
  let uvaRing='',uvbRing='',uvaBubble='',uvbBubble='';
  if(!mini){
    // UVA ring (outer of the two, at radius-14)
    if(times.uvaStart<times.uvaEnd){
      const segs=20;
      for(let i=0;i<segs;i++){
        const t1=i/segs,t2=(i+1)/segs;
        const h1=times.uvaStart+t1*(times.uvaEnd-times.uvaStart);
        const h2=times.uvaStart+t2*(times.uvaEnd-times.uvaStart);
        const midH=(h1+h2)/2;
        const v=uvaIndex(midH,times,true);
        const op=0.4+0.5*(v/11);
        uvaRing+='<path d="'+arcP(h1,h2,radius-14)+'" fill="none" stroke="#3b82f6" stroke-width="3.5" opacity="'+op+'"/>';
      }
    }
    // UVB ring (further inside, at radius-30)
    if(times.uvbStart<times.uvbEnd){
      const segs=20;
      for(let i=0;i<segs;i++){
        const t1=i/segs,t2=(i+1)/segs;
        const h1=times.uvbStart+t1*(times.uvbEnd-times.uvbStart);
        const h2=times.uvbStart+t2*(times.uvbEnd-times.uvbStart);
        const midH=(h1+h2)/2;
        const v=uvbIndex(midH,times,true);
        const op=0.4+0.5*(v/11);
        uvbRing+='<path d="'+arcP(h1,h2,radius-30)+'" fill="none" stroke="#a855f7" stroke-width="3.5" opacity="'+op+'"/>';
      }
    }
    // Bubbles - UVA at radius-14 (outer), UVB at radius-30 (INSIDE)
    const uvaVal=uvaIndex(hour,times,true);
    const uvbVal=uvbIndex(hour,times,true);
    if(uvaVal>0.1){
      const pos=p2x(sunAng,radius-14);
      uvaBubble='<g><line x1="'+sunPos.x+'" y1="'+sunPos.y+'" x2="'+pos.x+'" y2="'+pos.y+'" stroke="#3b82f6" stroke-width="0.8" opacity="0.5"/><circle cx="'+pos.x+'" cy="'+pos.y+'" r="9" fill="#000" stroke="#3b82f6" stroke-width="1.5"/><text x="'+pos.x+'" y="'+pos.y+'" fill="#60a5fa" class="uv-bubble-text" text-anchor="middle" dominant-baseline="middle">'+uvaVal.toFixed(1)+'</text></g>';
    }
    if(uvbVal>0.1){
      const pos=p2x(sunAng,radius-30);
      uvbBubble='<g><line x1="'+sunPos.x+'" y1="'+sunPos.y+'" x2="'+pos.x+'" y2="'+pos.y+'" stroke="#a855f7" stroke-width="0.8" opacity="0.5"/><circle cx="'+pos.x+'" cy="'+pos.y+'" r="9" fill="#000" stroke="#a855f7" stroke-width="1.5"/><text x="'+pos.x+'" y="'+pos.y+'" fill="#c084fc" class="uv-bubble-text" text-anchor="middle" dominant-baseline="middle">'+uvbVal.toFixed(1)+'</text></g>';
    }
  }

  // Arc labels
  let arcLabels='';
  if(!mini){
    function al(h,text,color,r){
      const a=h2a(h);
      const pos=p2x(a,r);
      return '<text x="'+pos.x+'" y="'+pos.y+'" fill="'+color+'" font-size="7" text-anchor="middle" dominant-baseline="middle" font-family="Outfit" font-weight="600" letter-spacing="0.5">'+text+'</text>';
    }
    arcLabels+=al(times.sunrise,'AMANECER','#fb923c',radius+38);
    arcLabels+=al(times.sunset,'OCASO','#dc2626',radius+38);
    arcLabels+=al(times.noon,'CENIT','#fbbf24',radius+38);
  }

  const dragH=!mini?'onpointerdown="sunSvgDown(event)"':'';
  const svgId='sunSvg_'+size; // Unique per size so panel & sol have different ids

  // Hormone reference curves (drawn behind the sun marker)
  let hormoneCurves='';
  if(!mini&&size>=300&&store.settings&&store.settings.hormoneLines){
    const HORMONE_PROFILES={
      // Each profile: function(h)->[0,1] amplitude
      leptin:{color:'#a7f3d0',fn:function(h){return 0.5+0.5*Math.cos(2*Math.PI*(h-((times.noon+12)%24))/24);}},
      cortisol:{color:'#fbbf24',fn:function(h){const peak=times.sunrise+0.5;const d=Math.min(Math.abs(h-peak),24-Math.abs(h-peak));return Math.max(0.05,Math.exp(-d*d/4)*0.95+0.05);}},
      melatonin:{color:'#c084fc',fn:function(h){const peak=(times.sunset+10)%24;const d=Math.min(Math.abs(h-peak),24-Math.abs(h-peak));return d<6?Math.exp(-d*d/3)*0.9:0.05;}},
      gh:{color:'#60a5fa',fn:function(h){const peak=(times.sunset+8)%24;const d=Math.min(Math.abs(h-peak),24-Math.abs(h-peak));return d<3?Math.exp(-d*d/1.5)*0.95:0.08;}},
      testosterone:{color:'#f87171',fn:function(h){const peak=(times.sunrise+1.5)%24;return 0.5+0.45*Math.cos(2*Math.PI*(h-peak)/24);}}
    };
    Object.keys(HORMONE_PROFILES).forEach(function(k){
      if(!store.settings.hormoneLines[k])return;
      const prof=HORMONE_PROFILES[k];
      // Build polyline path samples across 24h
      let pathPts=[];
      for(let i=0;i<=72;i++){
        const h=i/72*24;
        const amp=prof.fn(h);
        // Map amp [0..1] to inner radius range (28 to radius-50)
        const r=28+amp*(radius-78);
        const a=h2a(h);
        const p=p2x(a,r);
        pathPts.push(p.x.toFixed(1)+','+p.y.toFixed(1));
      }
      hormoneCurves+='<polyline points="'+pathPts.join(' ')+'" fill="none" stroke="'+prof.color+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" stroke-dasharray="3,2" pointer-events="none"/>';
      // Peak marker
      let peakH=0,peakAmp=0;
      for(let i=0;i<=72;i++){
        const h=i/72*24;
        const a=prof.fn(h);
        if(a>peakAmp){peakAmp=a;peakH=h;}
      }
      const peakP=p2x(h2a(peakH),28+peakAmp*(radius-78));
      hormoneCurves+='<circle cx="'+peakP.x+'" cy="'+peakP.y+'" r="3" fill="'+prof.color+'" opacity="0.9" pointer-events="none"/>';
      // Peak hour label (small)
      const lblP=p2x(h2a(peakH),28+peakAmp*(radius-78)-12);
      hormoneCurves+='<text x="'+lblP.x+'" y="'+lblP.y+'" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="7" fill="'+prof.color+'" opacity="0.85" pointer-events="none">'+Math.floor(peakH)+':'+String(Math.floor((peakH%1)*60)).padStart(2,'0')+'</text>';
    });
  }

  // Radial line goes BEHIND UV bubbles - use sunMarkerLine
  let sunMarkerLine='';
  if(!mini&&size>=300){
    // Line from very close to center, all the way to sun position - DASHED
    const innerStart=p2x(sunAng,16); // very close to center
    sunMarkerLine='<line x1="'+innerStart.x+'" y1="'+innerStart.y+'" x2="'+sunPos.x+'" y2="'+sunPos.y+'" stroke="#fde047" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4,3" opacity="0.7" style="filter:drop-shadow(0 0 4px rgba(253,224,71,0.4))" pointer-events="none"/>';
  }

  // Sun marker: only the sun itself (line is in sunMarkerLine, rendered earlier)
  let sunMarker;
  const isFullSize=size>=300;
  if(!mini&&isFullSize){
    sunMarker=
      // Large invisible hit area (22px radius for easy touch)
      '<circle cx="'+sunPos.x+'" cy="'+sunPos.y+'" r="22" fill="transparent" style="cursor:grab"/>'+
      // Soft glow halo
      '<circle cx="'+sunPos.x+'" cy="'+sunPos.y+'" r="10" fill="url(#sunGlow'+size+')" pointer-events="none"/>'+
      // Visible small sun circle
      '<circle cx="'+sunPos.x+'" cy="'+sunPos.y+'" r="6" fill="'+(isDay?'#fde047':'#94a3b8')+'" stroke="#000" stroke-width="1.5" style="filter:drop-shadow(0 0 6px rgba(253,224,71,0.7))" pointer-events="none"/>';
  }else{
    sunMarker=
      '<circle cx="'+sunPos.x+'" cy="'+sunPos.y+'" r="18" fill="transparent" style="cursor:grab"/>'+
      '<circle cx="'+sunPos.x+'" cy="'+sunPos.y+'" r="'+(mini?6:10)+'" fill="url(#sunGlow'+size+')" pointer-events="none"/>'+
      '<circle cx="'+sunPos.x+'" cy="'+sunPos.y+'" r="'+(mini?3.5:5)+'" fill="'+(isDay?'#fde047':'#94a3b8')+'" stroke="#000" stroke-width="'+(mini?1:1.5)+'" pointer-events="none"/>';
  }

  return '<svg class="sun-svg" id="'+svgId+'" viewBox="0 0 '+size+' '+size+'" '+dragH+' style="touch-action:none">'+
    '<defs>'+
      '<radialGradient id="bgGrad'+size+'" cx="50%" cy="50%">'+
        '<stop offset="0%" stop-color="'+sky.inner+'"/>'+
        '<stop offset="70%" stop-color="'+sky.outer+'"/>'+
        '<stop offset="100%" stop-color="rgba(0,0,0,0.4)"/>'+
      '</radialGradient>'+
      '<linearGradient id="dayGradMini'+size+'" x1="0%" y1="0%" x2="100%" y2="100%">'+
        '<stop offset="0%" stop-color="#fb923c"/>'+
        '<stop offset="50%" stop-color="#fbbf24"/>'+
        '<stop offset="100%" stop-color="#dc2626"/>'+
      '</linearGradient>'+
      '<radialGradient id="sunGlow'+size+'">'+
        '<stop offset="0%" stop-color="'+(isDay?'#fbbf24':'#94a3b8')+'" stop-opacity="0.9"/>'+
        '<stop offset="100%" stop-color="'+(isDay?'#fbbf24':'#94a3b8')+'" stop-opacity="0"/>'+
      '</radialGradient>'+
    '</defs>'+
    '<circle cx="'+center+'" cy="'+center+'" r="'+(radius+(mini?6:30))+'" fill="url(#bgGrad'+size+')"/>'+
    '<circle cx="'+center+'" cy="'+center+'" r="'+radius+'" fill="none" stroke="#1e293b" stroke-width="'+(mini?2:4)+'" opacity="0.4"/>'+
    dayArcs+uvaRing+uvbRing+hourTicks+hourMarkers+arcLabels+hormoneCurves+sunMarkerLine+
    (!mini?'<circle cx="'+p2x(h2a(times.sunrise),radius).x+'" cy="'+p2x(h2a(times.sunrise),radius).y+'" r="3.5" fill="#fb923c"/>':'')+
    (!mini?'<circle cx="'+p2x(h2a(times.sunset),radius).x+'" cy="'+p2x(h2a(times.sunset),radius).y+'" r="3.5" fill="#dc2626"/>':'')+
    (!mini?'<circle cx="'+p2x(h2a(times.noon),radius).x+'" cy="'+p2x(h2a(times.noon),radius).y+'" r="3" fill="#fbbf24"/>':'')+
    uvaBubble+uvbBubble+
    sunMarker+
  '</svg>';
}

// PANEL solar - compact with UV bars + simple link
function renderSunPanel(times,hour,uv,isDay){
  const uvColor=uv>=8?'#dc2626':uv>=6?'#f59e0b':uv>=3?'#fbbf24':uv>=1?'#a7f3d0':'#475569';
  const phase=getCurrentPhase(hour,times);
  const uva=uvaIndex(hour,times,true);
  const uvb=uvbIndex(hour,times,true);
  return '<div class="card" style="padding:10px;position:relative">'+
    '<div class="sun-container" style="max-width:210px;margin:0 auto;position:relative">'+
      renderSunSVG(times,hour,uv,isDay,210,false)+
      '<div class="sun-center-text" style="width:72%;pointer-events:none">'+
        '<div class="sun-time-big" style="font-size:20px">'+fmtHour(hour)+'</div>'+
        '<div class="sun-time-small" style="font-size:7px;letter-spacing:1px;margin-top:2px">'+(sunLive?'<span class="sun-live-dot"></span>EN VIVO ':'')+phase+'</div>'+
        '<div class="sun-uv-big" style="color:'+uvColor+';font-size:13px;margin-top:3px">UV '+uv.toFixed(1)+'</div>'+
      '</div>'+
      // Small UVA/UVB chips overlaid bottom-right of the graph
      '<div class="panel-uv-mini">'+
        '<div class="panel-uv-chip" style="color:#60a5fa"><span>UVA</span>'+uva.toFixed(1)+'</div>'+
        '<div class="panel-uv-chip" style="color:#c084fc"><span>UVB</span>'+uvb.toFixed(1)+'</div>'+
      '</div>'+
    '</div>'+
    // IR (top) + EN VIVO (below) stacked in top-right corner
    '<div class="panel-sun-actions">'+
      '<button class="panel-ir-btn" onclick="showTab(\'sol\')" title="Ir a Sol">IR →</button>'+
      (!sunLive?'<button class="live-mini-btn-stacked" onclick="resetSunLive()" title="Volver a en vivo">⚡ EN VIVO</button>':'')+
    '</div>'+
  '</div>';
}

// FULL SUN DASHBOARD
function renderSunDashboard(times,hour,uv,isDay){
  const uvColor=uv>=8?'#dc2626':uv>=6?'#f59e0b':uv>=3?'#fbbf24':uv>=1?'#a7f3d0':'#475569';
  const phase=getCurrentPhase(hour,times);
  return '<div class="card" style="padding:14px 10px;position:relative">'+
    // Floating "Volver a en vivo" top-right (only when not live)
    (!sunLive?'<button class="live-mini-btn-floating" onclick="resetSunLive()" title="Volver a en vivo">⚡ EN VIVO</button>':'')+
    '<div class="sun-container" id="sunContainer" style="max-width:340px">'+
      renderSunSVG(times,hour,uv,isDay,340,false)+
      '<div class="sun-center-text">'+
        '<div class="sun-time-big">'+fmtHour(hour)+'</div>'+
        '<div class="sun-time-small">'+(sunLive?'<span class="sun-live-dot"></span>EN VIVO ':'')+phase+'</div>'+
        '<div class="sun-uv-big" style="color:'+uvColor+'">UV '+uv.toFixed(1)+'</div>'+
      '</div>'+
    '</div>'+
    '<div style="display:flex;justify-content:center;gap:14px;font-size:9.5px;color:var(--text-muted);margin-top:4px;flex-wrap:wrap;letter-spacing:0.4px;font-family:var(--sans)">'+
      '<span><span style="display:inline-block;width:8px;height:3px;background:#fbbf24;vertical-align:middle;margin-right:3px"></span>DÍA</span>'+
      '<span><span style="display:inline-block;width:8px;height:3px;background:#3b82f6;vertical-align:middle;margin-right:3px"></span>UVA</span>'+
      '<span><span style="display:inline-block;width:8px;height:3px;background:#a855f7;vertical-align:middle;margin-right:3px"></span>UVB</span>'+
    '</div>'+
    '<div class="sun-times-list">'+
      '<div class="sun-time-cell"><div class="sun-time-cell-label">🌅 AMANECER</div><div class="sun-time-cell-value">'+fmtHour(times.sunrise)+'</div></div>'+
      '<div class="sun-time-cell"><div class="sun-time-cell-label">☀️ CENIT</div><div class="sun-time-cell-value">'+fmtHour(times.noon)+'</div></div>'+
      '<div class="sun-time-cell"><div class="sun-time-cell-label">🌇 OCASO</div><div class="sun-time-cell-value">'+fmtHour(times.sunset)+'</div></div>'+
      '<div class="sun-time-cell"><div class="sun-time-cell-label">UVA ↑↓</div><div class="sun-time-cell-value" style="color:#3b82f6;font-size:11px">'+fmtHour(times.uvaStart)+'-'+fmtHour(times.uvaEnd)+'</div></div>'+
      '<div class="sun-time-cell"><div class="sun-time-cell-label">UVB ↑↓</div><div class="sun-time-cell-value" style="color:#a855f7;font-size:11px">'+fmtHour(times.uvbStart)+'-'+fmtHour(times.uvbEnd)+'</div></div>'+
      '<div class="sun-time-cell"><div class="sun-time-cell-label">DÍA TOTAL</div><div class="sun-time-cell-value">'+times.dayLen.toFixed(1)+'h</div></div>'+
    '</div>'+
  '</div>';
}

function getCurrentPhase(hour,times){
  if(hour>=times.blueMorning.start&&hour<times.sunrise)return 'HORA AZUL';
  if(hour>=times.goldenMorning.start&&hour<=times.goldenMorning.end)return 'HORA DORADA';
  if(hour>=times.uvbStart&&hour<=times.uvbEnd)return 'UVB ÓPTIMA';
  if(hour>=times.sunrise&&hour<times.uvbStart)return 'MAÑANA';
  if(hour>times.uvbEnd&&hour<times.goldenEvening.start)return 'TARDE';
  if(hour>=times.goldenEvening.start&&hour<=times.goldenEvening.end)return 'HORA DORADA';
  if(hour>times.sunset&&hour<=times.blueEvening.end)return 'HORA AZUL';
  if(hour>times.sunset||hour<times.sunrise)return 'NOCHE';
  return 'DÍA';
}
// Sun drag - persistent document listeners during drag
// Cache rect so re-renders don't break the drag
var sunDragRect=null;
var sunDragRAF=null;
var sunDragLastHour=null;

// Document-level pointerdown delegation - works even if inline handlers don't fire
function sunSvgPointerDown(e){
  try{
    // Find the SVG via target
    const svg=e.target&&e.target.closest&&e.target.closest('svg.sun-svg');
    if(!svg)return;
    // Don't capture clicks on links/buttons inside the card
    const interactive=e.target&&e.target.closest&&e.target.closest('button,a,input,select');
    if(interactive)return;
    sunDragging=true;
    sunSvgEl=svg;
    sunDragRect=svg.getBoundingClientRect();
    document.addEventListener('pointermove',sunSvgMoveGlobal,{passive:false});
    document.addEventListener('pointerup',sunSvgUpGlobal,{passive:true});
    document.addEventListener('pointercancel',sunSvgUpGlobal,{passive:true});
    sunSvgMoveGlobal(e);
    if(e.preventDefault)e.preventDefault();
  }catch(err){}
}

// Set up global delegation once
if(!window.__sunDragInit){
  window.__sunDragInit=true;
  document.addEventListener('pointerdown',sunSvgPointerDown,{passive:false});
  // Touch fallback for iOS Safari (sometimes pointer events don't fire on SVG)
  document.addEventListener('touchstart',function(e){
    const svg=e.target&&e.target.closest&&e.target.closest('svg.sun-svg');
    if(!svg)return;
    const interactive=e.target&&e.target.closest&&e.target.closest('button,a,input,select');
    if(interactive)return;
    sunDragging=true;
    sunSvgEl=svg;
    sunDragRect=svg.getBoundingClientRect();
    document.addEventListener('touchmove',sunTouchMove,{passive:false});
    document.addEventListener('touchend',sunTouchEnd,{passive:true});
    document.addEventListener('touchcancel',sunTouchEnd,{passive:true});
    sunTouchMove(e);
    if(e.cancelable)e.preventDefault();
  },{passive:false});
}

function sunTouchMove(e){
  try{
    if(!sunDragging||!sunDragRect||!e.touches||!e.touches[0])return;
    const rect=sunDragRect;
    const cx=e.touches[0].clientX;
    const cy=e.touches[0].clientY;
    sunDragUpdateAngle(cx,cy,rect);
    if(e.cancelable)e.preventDefault();
  }catch(err){}
}
function sunTouchEnd(){
  sunDragging=false;
  sunDragRect=null;
  sunDragLastHour=null;
  if(sunDragRAF){cancelAnimationFrame(sunDragRAF);sunDragRAF=null;}
  sunSvgEl=null;
  document.removeEventListener('touchmove',sunTouchMove);
  document.removeEventListener('touchend',sunTouchEnd);
  document.removeEventListener('touchcancel',sunTouchEnd);
}

function sunDragUpdateAngle(cx,cy,rect){
  const x=cx-rect.left-rect.width/2;
  const y=cy-rect.top-rect.height/2;
  let angle=Math.atan2(y,x)*180/Math.PI;
  angle+=90;
  if(angle<0)angle+=360;
  const newHour=(angle/360)*24;
  sunSliderHour=newHour;
  sunLive=false;
  if(sunDragLastHour===null||Math.abs(newHour-sunDragLastHour)>0.04){
    sunDragLastHour=newHour;
    if(!sunDragRAF){
      sunDragRAF=requestAnimationFrame(function(){
        sunDragRAF=null;
        if(currentTab==='sol'||currentTab==='panel'){
          render();
          const svg=document.querySelector('.sun-svg');
          if(svg)sunDragRect=svg.getBoundingClientRect();
        }
      });
    }
  }
}

// Keep these for backwards compat (some inline handlers may still call them)
function sunSvgDown(e){sunSvgPointerDown(e);}

function sunSvgMoveGlobal(e){
  try{
    if(!sunDragging||!sunDragRect)return;
    sunDragUpdateAngle(e.clientX,e.clientY,sunDragRect);
    if(e.preventDefault)e.preventDefault();
  }catch(err){}
}

function sunSvgUpGlobal(){
  sunDragging=false;
  sunDragRect=null;
  sunDragLastHour=null;
  if(sunDragRAF){cancelAnimationFrame(sunDragRAF);sunDragRAF=null;}
  sunSvgEl=null;
  document.removeEventListener('pointermove',sunSvgMoveGlobal);
  document.removeEventListener('pointerup',sunSvgUpGlobal);
  document.removeEventListener('pointercancel',sunSvgUpGlobal);
}

// Compatibility aliases (still referenced by SVG inline handlers)
function sunSvgMove(e){sunSvgMoveGlobal(e);}
function sunSvgUp(){sunSvgUpGlobal();}

function resetSunLive(){sunLive=true;sunSliderHour=new Date().getHours()+new Date().getMinutes()/60;render();}

// Auto-detect weather using free Open-Meteo (no key required)
function detectWeather(){
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(function(pos){
    const lat=pos.coords.latitude,lng=pos.coords.longitude;
    fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lng+'&current=cloud_cover,precipitation&timezone=auto').then(function(r){return r.json();}).then(function(d){
      const cc=d.current&&d.current.cloud_cover;
      const pp=d.current&&d.current.precipitation;
      let w='soleado';
      if(pp>0.1)w='lluvia';
      else if(cc>=85)w='muyNublado';
      else if(cc>=60)w='nublado';
      else if(cc>=25)w='parcial';
      else w='soleado';
      store.settings.weather=w;
      saveSettings();
      if(currentTab==='sol'||currentTab==='panel')render();
    }).catch(function(){});
  });
}

// Describes the body's circadian/hormonal state at a given hour, anchored to sun times.
// Returns {phase, color, icon, hormones:[{name,level,color}], notes:[...]}
function bodyStateNow(hour,times){
  const sunrise=times.sunrise,sunset=times.sunset,noon=times.noon;
  const cortisolPeak=sunrise+0.5;

  const testoPeak=(sunrise+1.5)%24;
  const lastMealIdeal=sunset-2;
  // normalize helper for "distance" in circular hours
  function near(h,target,window){let d=Math.abs(h-target);d=Math.min(d,24-d);return d<=window;}
  let phase,color,icon,desc,hormones=[],notes=[];

  const isNight=hour<sunrise-0.5||hour>sunset+1.5;
  const isDay=hour>=sunrise&&hour<=sunset;

  if(near(hour,cortisolPeak,1.2)){
    phase='Despertar — Pico de cortisol (CAR)';color='#fbbf24';icon='⚡';
    desc='Cortisol en su punto máximo (respuesta de despertar). El cuerpo moviliza glucosa: glucemia subiendo, alerta máxima. Buen momento para luz solar directa.';
    hormones=[{name:'Cortisol',level:'Máximo',color:'#fbbf24'},{name:'Melatonina',level:'Cayendo',color:'#7c8'},{name:'Testosterona',level:'Alta',color:'#f87171'}];
    notes=['☀️ Luz solar 5-10 min potencia el ritmo','☕ Retrasa la cafeína ≥90 min','🍳 Glucemia en ascenso natural'];
  }else if(hour>cortisolPeak+1.2&&hour<noon){
    phase='Mañana — Alta energía';color='#a7f3d0';icon='🌅';
    desc='Cortisol descendiendo desde el pico pero aún elevado. Mayor sensibilidad a la insulina y rendimiento cognitivo alto. Si estás en ayunas, oxidación de grasas activa.';
    hormones=[{name:'Cortisol',level:'Alto ↓',color:'#fbbf24'},{name:'Insulina',level:'Sensible',color:'#60a5fa'},{name:'Testosterona',level:'Pico',color:'#f87171'}];
    notes=['🏋️ Ventana ideal para fuerza/cognición','🔥 En ayunas: oxidación de grasas','🥩 Si rompes ayuno, prioriza proteína'];
  }else if(near(hour,noon,1.5)){
    phase='Mediodía — Vitamina D óptima';color='#fde047';icon='☀️';
    desc='Sol en su punto más alto: máxima síntesis de vitamina D (UVB elevado). Cortisol moderado, energía estable. Termorregulación y vigilancia altas.';
    hormones=[{name:'Cortisol',level:'Medio',color:'#fbbf24'},{name:'Vitamina D',level:'Síntesis máx',color:'#fde047'},{name:'Serotonina',level:'Alta',color:'#a7f3d0'}];
    notes=['☀️ Exposición solar sin cristales','👁️ Mira al horizonte, nunca al sol','💧 Hidratación con minerales'];
  }else if(hour>noon&&hour<sunset-2){
    phase='Tarde — Rendimiento físico';color='#60a5fa';icon='💪';
    desc='Temperatura corporal y función pulmonar en su pico: mejor coordinación y fuerza. Cortisol bajando. Tiempo de reacción óptimo a media tarde.';
    hormones=[{name:'Cortisol',level:'Bajando',color:'#fbbf24'},{name:'Temp. corporal',level:'Pico',color:'#fb923c'},{name:'Testosterona',level:'Media',color:'#f87171'}];
    notes=['🏃 Pico de rendimiento físico','🫁 Función pulmonar máxima','⚡ Mejor coordinación'];
  }else if(hour>=sunset-2&&hour<melatoninRise){
    phase='Atardecer — Última comida ideal';color='#fb923c';icon='🌇';
    desc='Cortisol cerca del mínimo. La sensibilidad a la insulina baja: idealmente cena ≥3h antes de dormir. El cuerpo se prepara para la fase de descanso.';
    hormones=[{name:'Cortisol',level:'Mínimo',color:'#a7f3d0'},{name:'Insulina',level:'Menos sensible',color:'#60a5fa'},{name:'Melatonina',level:'Pronto ↑',color:'#c084fc'}];
    notes=['🛑 Cena antes de las '+fmtHour(lastMealIdeal),'🌅 Última comida ≥3h antes de dormir','🌇 Busca luz del atardecer'];
  }else if(hour>=melatoninRise&&hour<melatoninPeak){
    phase='Noche — Subida de melatonina (DLMO)';color='#c084fc';icon='🌙';
    desc='Comienza la secreción de melatonina (DLMO). La luz brillante ahora la suprime y retrasa el sueño. Temperatura corporal cayendo, preparándose para dormir.';
    hormones=[{name:'Melatonina',level:'Subiendo',color:'#c084fc'},{name:'Cortisol',level:'Muy bajo',color:'#a7f3d0'},{name:'Temp. corporal',level:'Bajando',color:'#60a5fa'}];
    notes=['🕯️ Luz cálida y tenue (fuego/vela)','🔴 Luz roja o ámbar si necesitas','🛌 Prepárate para dormir'];
  }else{
    phase='Sueño — Reparación';color='#818cf8';icon='😴';
    desc='Melatonina alta, cortisol en mínimo. Pico de hormona del crecimiento durante el sueño profundo: reparación de tejidos y consolidación de memoria. Glucemia estable y baja.';
    hormones=[{name:'Melatonina',level:'Máxima',color:'#c084fc'},{name:'H. crecimiento',level:'Pico (sueño)',color:'#a7f3d0'},{name:'Cortisol',level:'Mínimo → ↑',color:'#7c8'}];

  return {phase:phase,color:color,icon:icon,desc:desc,hormones:hormones,notes:notes};

// Render a registros block: expandable container with search bar.
// Always expanded if there's data. Shows last 5 by default; rest accessible via scroll.
// Parameters:
//   key: store key (e.g. 'weight','sleep','fasting','measurements','allergy','vo2history','sun','meditation','activity','records')
//   label: display label
//   itemRenderer(item): returns HTML string for the content of each item
//   opts: { chartLabel, chartKey, chartColor, searchFn(item, q) }
// Registry of item renderers so setRegSearch can rebuild list without full re-render
const REG_RENDERERS={};
function renderRegistros(key,label,itemRenderer,opts){
  opts=opts||{};
  const arr=Array.isArray(store[key])?store[key]:[];
  if(!arr.length)return '';
  REG_RENDERERS[key]={renderer:itemRenderer,opts:opts,label:label};
  const collapsedId='reg_'+key;
  const collapsed=store.collapsed[collapsedId]===true; // expanded by default when data
  const searchQ=(regSearch[key]||'');
  const total=filterRegItems(key,searchQ).length;
  let h='<div class="registros-block" style="margin-top:10px">'+
    '<div class="registros-header" onclick="toggleEstadoBlock(\''+collapsedId+'\')">'+
      '<span class="registros-title">📋 '+label+' <span class="registros-count" id="regcount_'+key+'">('+total+')</span></span>'+
      '<button class="collapse-btn">'+(collapsed?'▼':'▲')+'</button>'+
    '</div>'+
    '<div class="collapsible'+(collapsed?' collapsed':'')+'">'+
    // Search row + chart button INLINE
    '<div class="registros-toolbar">'+
      '<input type="text" class="registros-search" id="regsearch_'+key+'" placeholder="🔍 Buscar (texto o fecha)..." value="'+escapeHTML(searchQ)+'" oninput="setRegSearch(\''+key+'\',this.value)">'+
      (opts.chartLabel&&opts.chartKey?'<button class="chart-icon-btn" onclick="openChartModal(\''+escapeHTML(opts.chartLabel)+'\',\''+key+'\',\''+opts.chartKey+'\','+(opts.chartColor?'\''+opts.chartColor+'\'':'null')+')">📈</button>':'')+
    '</div>'+
    '<div class="registros-list" id="reglist_'+key+'">'+
      buildRegItems(key,searchQ)+
    '</div>'+
    '</div></div>';
  return h;
}

function filterRegItems(key,searchQ){
  const arr=Array.isArray(store[key])?store[key]:[];
  let items=arr.slice().reverse();
  const q=(searchQ||'').toLowerCase().trim();
  if(q){
    items=items.filter(function(it){
      try{
        // match raw fields
        const str=JSON.stringify(it).toLowerCase();
        if(str.indexOf(q)!==-1)return true;
        // match formatted date (e.g. "12 mar", "2024-03-12")
        if(it.date){
          const fd=fmtDate(it.date).toLowerCase();
          if(fd.indexOf(q)!==-1)return true;
          if(String(it.date).toLowerCase().indexOf(q)!==-1)return true;
        }
        return false;
      }catch(e){return true;}
    });
  }
  return items;
}

function buildRegItems(key,searchQ){
  const reg=REG_RENDERERS[key];if(!reg)return '';
  const items=filterRegItems(key,searchQ);
  if(!items.length)return '<div style="text-align:center;font-size:11px;color:var(--text-dim);padding:14px;font-style:italic;font-family:var(--serif)">Sin resultados</div>';
  let h='';
  items.forEach(function(it){
    h+='<div class="history-item">'+
      '<div class="history-item-content">'+
        '<div class="history-item-date">'+fmtDate(it.date)+'</div>'+
        reg.renderer(it)+
      '</div>'+
      '<div class="history-item-actions">'+
        (it.video?'<button class="view-btn" onclick="openVideoViewer(\''+key+'\','+it.id+')" aria-label="Ver vídeo">▶</button>':'')+
        '<button class="edit-btn" onclick="editItem(\''+key+'\','+it.id+')" aria-label="Editar">✎</button>'+
        '<button class="delete-btn" onclick="delItem(\''+key+'\','+it.id+')" aria-label="Eliminar">✕</button>'+
      '</div>'+
    '</div>';
  });
  return h;
}

const regSearch={};
function setRegSearch(key,val){
  regSearch[key]=val;
  // Update ONLY the list + count, preserving the input focus (no full render)
  const list=document.getElementById('reglist_'+key);
  if(list)list.innerHTML=buildRegItems(key,val);
  const cnt=document.getElementById('regcount_'+key);
  if(cnt)cnt.textContent='('+filterRegItems(key,val).length+')';
}

// Groups of mutually-exclusive (accordion) blocks per section.
// When one opens, the others in its group collapse — EXCEPT registros sub-lists
// and the first/default block which may stay as configured.
const ACCORDION_GROUPS={
  estado:['fasting','sleep','body','allergy','vo2','light','health'],
  actividad:['weekly','sport','records','wods'],
  sol:['environment','skinclothing','hormones','suntimer'],
  ajustes:['setdata','setloc','setsports','setsummary','setglossary','setabout']
};
function findAccordionGroup(id){
  for(const sec in ACCORDION_GROUPS){
    if(ACCORDION_GROUPS[sec].indexOf(id)!==-1)return ACCORDION_GROUPS[sec];
  }
  return null;
}
function toggleEstadoBlock(id){
  const wasCollapsed=store.collapsed[id]!==false?true:false;
  // toggle this one
  store.collapsed[id]=!store.collapsed[id];
  // If we are OPENING it (it was collapsed, now expanding) and it's in an accordion group,
  // collapse the other blocks in the same group.
  const nowOpen=store.collapsed[id]===false;
  const group=findAccordionGroup(id);
  if(nowOpen&&group){
    group.forEach(function(other){
      if(other!==id)store.collapsed[other]=true;
    });
  }
  saveCollapsed();render();
}
function toggleEstadoBlockSimple(id){store.collapsed[id]=!store.collapsed[id];saveCollapsed();render();}

// Unified add for body block (saves to both stores if values present)
function addBody(){
  const date=document.getElementById('bodyDate').value;
  const weightVal=document.getElementById('bodyWeight').value;
  if(!date)return alert('Selecciona fecha');
  if(weightVal&&dateExists('weight',date))return warnDuplicate('peso');
  const hasMeasure=document.getElementById('mWaist').value||document.getElementById('mChest').value||document.getElementById('mThigh').value||document.getElementById('mBicep').value||document.getElementById('mHip').value||document.getElementById('mNeck').value||measPhotoData;
  if(hasMeasure&&dateExists('measurements',date))return warnDuplicate('medidas');
  let saved=false;
  if(weightVal){
    store.weight.push({id:Date.now(),date:date,value:weightVal});
    save('weight',store.weight);
    saved=true;
  }
  const m={id:Date.now()+1,date:date,
    waist:document.getElementById('mWaist').value,
    chest:document.getElementById('mChest').value,
    thigh:document.getElementById('mThigh').value,
    bicep:document.getElementById('mBicep').value,
    hip:document.getElementById('mHip').value,
    neck:document.getElementById('mNeck').value,
    photo:measPhotoData||null};
  if(m.waist||m.chest||m.thigh||m.bicep||m.hip||m.neck||m.photo){
    store.measurements.push(m);
    save('measurements',store.measurements);
    saved=true;
  }
  if(!saved)return alert('Introduce al menos un valor (peso o medida)');
  measPhotoData=null;
  render();
}

function updateFastDur(){const start=document.getElementById('fastStart');const end=document.getElementById('fastEnd');if(!start||!end||!start.value||!end.value)return;const sp=start.value.split(':').map(Number);const ep=end.value.split(':').map(Number);let s=sp[0]*60+sp[1],e=ep[0]*60+ep[1];if(e<=s)e+=24*60;const durDec=(e-s)/60;const d=document.getElementById('fastDurDisplay');if(d){d.textContent=fmtDuration(durDec);}const f=durDec;let badgeHtml='';if(f>16)badgeHtml='<span class="fast-goal-inline fast-goal-extended">🎯 +16h</span>';else if(f>=12)badgeHtml='<span class="fast-goal-inline fast-goal-met">✓ 12-16h</span>';else badgeHtml='<span class="fast-goal-inline fast-goal-pending">Meta 16h</span>';const bw=document.getElementById('fastBadgeWrap');if(bw)bw.innerHTML=badgeHtml;}

let measPhotoData=null;
function handleMeasPhoto(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    const img=new Image();
    img.onload=function(){
      const canvas=document.createElement('canvas');
      const maxDim=900;
      let w=img.width,h=img.height;
      if(w>h&&w>maxDim){h=h*(maxDim/w);w=maxDim;}
      else if(h>maxDim){w=w*(maxDim/h);h=maxDim;}
      canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      measPhotoData=canvas.toDataURL('image/jpeg',0.78);
      const prev=document.getElementById('measPhotoPreview');

      if(ph)ph.style.display='none';
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ============= LIGHT LOG (Amanecer / Ocaso / Higiene lumínica) =============
// Monthly calendar of checkmarks. Each habit stored as store.lightLog[habit][YYYY-MM][day]=true.
// "Histórico" is implicit: past months remain stored under their own YYYY-MM key.
let lightMonth=null; // 'YYYY-MM' currently viewed; null = current month
const LIGHT_HABITS=[
  {key:'amanecer',icon:'🌅',name:'Amanecer',desc:'Luz solar al despertar'},
  {key:'ocaso',icon:'🌇',name:'Ocaso',desc:'Luz del atardecer / menos luz azul'},
  {key:'higiene',icon:'💡',name:'Higiene lumínica',desc:'Oscuridad nocturna, sin pantallas'}
];
function lightCurrentMonth(){return lightMonth||today().substring(0,7);}
function shiftLightMonth(dir){
  const cur=lightCurrentMonth();
  const parts=cur.split('-');let y=parseInt(parts[0]),m=parseInt(parts[1]);
  m+=dir;if(m<1){m=12;y--;}else if(m>12){m=1;y++;}
  lightMonth=y+'-'+String(m).padStart(2,'0');
  // don't allow navigating into the future beyond current month
  if(lightMonth>today().substring(0,7))lightMonth=today().substring(0,7);
  render();
}
function toggleLightDay(habit,dateStr){
  if(!store.lightLog[habit])store.lightLog[habit]={};
  const ym=dateStr.substring(0,7);
  if(!store.lightLog[habit][ym])store.lightLog[habit][ym]={};
  const day=parseInt(dateStr.substring(8,10));
  if(store.lightLog[habit][ym][day])delete store.lightLog[habit][ym][day];
  else store.lightLog[habit][ym][day]=true;
  save('lightLog',store.lightLog);
  render();
}
function monthName(ym){
  const months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const parts=ym.split('-');return months[parseInt(parts[1])-1]+' '+parts[0];
}
function renderLightBlock(){
  const collapsed=store.collapsed.light!==false;
  const ym=lightCurrentMonth();
  const parts=ym.split('-');const year=parseInt(parts[0]),month=parseInt(parts[1]);
  const daysInMonth=new Date(year,month,0).getDate();
  const todayStr=today();
  const isCurrentMonth=ym===todayStr.substring(0,7);
  const todayDay=isCurrentMonth?parseInt(todayStr.substring(8,10)):-1;
  // weekday of day 1 (0=Sun..6=Sat) → convert to Mon-first
  let firstDow=new Date(year,month-1,1).getDay();firstDow=(firstDow+6)%7;
  let h='<div class="card" id="s-light">'+
    blockHeader('light','🌗','LUZ Y RITMO','Higiene lumínica')+
    '<div class="collapsible'+(collapsed?' collapsed':'')+'">'+
      // Month navigator
      '<div class="light-month-nav">'+
        '<button class="light-month-btn" onclick="shiftLightMonth(-1)">‹</button>'+
        '<span class="light-month-label">'+monthName(ym)+'</span>'+
        '<button class="light-month-btn" onclick="shiftLightMonth(1)"'+(isCurrentMonth?' disabled style="opacity:0.3"':'')+'>›</button>'+
      '</div>';
  LIGHT_HABITS.forEach(function(hab){
    const monthData=(store.lightLog[hab.key]||{})[ym]||{};
    let doneCount=Object.keys(monthData).length;
    h+='<div class="light-habit">'+
      '<div class="light-habit-head">'+
        '<span class="light-habit-icon">'+hab.icon+'</span>'+
        '<div style="flex:1;min-width:0"><div class="light-habit-name">'+hab.name+'</div><div class="light-habit-desc">'+hab.desc+'</div></div>'+
        '<span class="light-habit-count">'+doneCount+'/'+daysInMonth+'</span>'+
      '</div>'+
      '<div class="light-grid">';
    // weekday headers
    ['L','M','X','J','V','S','D'].forEach(function(wd){h+='<div class="light-wd">'+wd+'</div>';});
    // empty cells before day 1
    for(let i=0;i<firstDow;i++)h+='<div class="light-cell empty"></div>';
    for(let d=1;d<=daysInMonth;d++){
      const dateStr=ym+'-'+String(d).padStart(2,'0');
      const checked=monthData[d]===true;
      const isToday=d===todayDay;
      const isFuture=isCurrentMonth&&d>todayDay;
      h+='<div class="light-cell'+(checked?' checked':'')+(isToday?' today':'')+(isFuture?' future':'')+'" '+(isFuture?'':'onclick="toggleLightDay(\''+hab.key+'\',\''+dateStr+'\')"')+'>'+
        (checked?'<span class="light-check">✓</span>':'<span class="light-daynum">'+d+'</span>')+

  });

  h+='</div></div>';
  return h;
}

// ============= HEALTH ANALYSIS ENGINE =============
// Integrative health scoring based on current evidence-based targets.
// Each domain scored 0-100 vs optimal, then weighted into a composite.
let healthPeriod='1m';
const HEALTH_PERIODS=[{k:'7d',l:'7 días',days:7},{k:'2w',l:'2 sem',days:14},{k:'1m',l:'1 mes',days:30},{k:'6m',l:'6 meses',days:182},{k:'1y',l:'1 año',days:365},{k:'all',l:'Histórico',days:99999}];

function filterByDays(arr,days){
  if(!Array.isArray(arr))return [];
  const cutoff=Date.now()-days*86400000;
  return arr.filter(function(x){const t=new Date(x.date).getTime();return !isNaN(t)&&t>=cutoff;});
}
function mean(arr,key){if(!arr.length)return 0;let s=0,n=0;arr.forEach(function(x){const v=parseFloat(key?x[key]:x);if(!isNaN(v)){s+=v;n++;}});return n?s/n:0;}

// Returns {domains:[{name,score,value,optimal,unit,trend}], composite, hasData}
function computeHealth(days){
  const domains=[];
  // SLEEP domain (duration + HRV + score)
  const sl=filterByDays(store.sleep,days);
  if(sl.length){
    const avgScores=sl.map(function(s){return evalSleep(s).composite;});
    const sleepScore=Math.round(mean(avgScores));
    domains.push({name:'Sueño',icon:'😴',score:sleepScore,value:fmtDuration(mean(sl,'hours'))+' · HRV '+Math.round(mean(sl,'hrv')),optimal:'7-9h · HRV alto',weight:0.28});
  }
  // ACTIVITY domain (frequency + completed days)
  const act=filterByDays(store.activity,days);
  if(act.length||days>=7){
    const weeks=Math.max(1,days/7);
    const perWeek=act.length/weeks;
    // optimal: 4-6 sessions/week
    let actScore;
    if(perWeek>=4&&perWeek<=7)actScore=100;
    else if(perWeek>=3)actScore=80;
    else if(perWeek>=2)actScore=60;
    else if(perWeek>=1)actScore=40;
    else actScore=Math.min(35,perWeek*35);
    domains.push({name:'Actividad',icon:'🏋️',score:Math.round(actScore),value:perWeek.toFixed(1)+'/sem',optimal:'4-6/sem',weight:0.24});
  }
  // FASTING domain
  const fa=filterByDays(store.fasting,days);
  if(fa.length){
    const avgDur=mean(fa,'duration');
    let fastScore;
    if(avgDur>=14&&avgDur<=18)fastScore=100;
    else if(avgDur>=12&&avgDur<14)fastScore=85;
    else if(avgDur>=16&&avgDur<=20)fastScore=95;
    else if(avgDur>=10)fastScore=65;
    else fastScore=Math.max(30,avgDur*5);
    domains.push({name:'Ayuno',icon:'🕐',score:Math.round(fastScore),value:fmtDuration(avgDur),optimal:'14-18h',weight:0.16});
  }
  // SUN / Vit D domain
  const sun=filterByDays(store.sun,days);
  if(sun.length){
    const weeks=Math.max(1,days/7);
    const perWeek=sun.length/weeks;
    let sunScore=perWeek>=4?100:perWeek>=2?75:perWeek>=1?50:30;
    domains.push({name:'Sol / Vit D',icon:'☀️',score:Math.round(sunScore),value:perWeek.toFixed(1)+' expos/sem',optimal:'≥4/sem',weight:0.12});
  }
  // MEDITATION domain
  const med=filterByDays(store.meditation,days);
  if(med.length){
    const weeks=Math.max(1,days/7);
    const perWeek=med.length/weeks;
    let medScore=perWeek>=5?100:perWeek>=3?80:perWeek>=1?55:30;
    domains.push({name:'Meditación',icon:'🧘',score:Math.round(medScore),value:perWeek.toFixed(1)+'/sem',optimal:'≥5/sem',weight:0.10});
  }
  // ALLERGY domain (lower is better - inverse)
  const al=filterByDays(store.allergy,days);
  if(al.length){
    const avgLevel=mean(al,'level');
    let alScore=Math.max(0,100-avgLevel*10);
    domains.push({name:'Alergia',icon:'🤧',score:Math.round(alScore),value:'Intens. '+avgLevel.toFixed(1)+'/10',optimal:'baja',weight:0.10});
  }
  // VO2max domain
  if(store.vo2max){
    const v=parseFloat(store.vo2max);
    let vScore;
    if(v>=50)vScore=100;else if(v>=45)vScore=88;else if(v>=40)vScore=75;else if(v>=35)vScore=60;else if(v>=30)vScore=45;else vScore=Math.max(20,v);
    domains.push({name:'VO₂ Max',icon:'🫁',score:Math.round(vScore),value:v+' ml/kg/min',optimal:'≥45',weight:0.14});
  }
  // Composite (re-normalize weights to present domains)
  let tw=0,acc=0;domains.forEach(function(d){tw+=d.weight;acc+=d.weight*d.score;});
  const composite=tw>0?Math.round(acc/tw):0;
  return {domains:domains,composite:composite,hasData:domains.length>0};
}

function healthRating(score){
  if(score>=85)return {label:'Excelente',color:'#34d399',emoji:'🌟'};
  if(score>=72)return {label:'Muy bueno',color:'#a7f3d0',emoji:'💚'};
  if(score>=58)return {label:'Bueno',color:'#fbbf24',emoji:'🙂'};
  if(score>=42)return {label:'Mejorable',color:'#fb923c',emoji:'😐'};
  return {label:'Necesita atención',color:'#f87171',emoji:'⚠️'};
}

// Compare current period vs previous same-length period to get trend
function healthTrend(days){
  const cur=computeHealth(days).composite;
  // previous window
  const cutoffNow=Date.now()-days*86400000;
  function inPrev(arr){if(!Array.isArray(arr))return [];const a=Date.now()-days*2*86400000;return arr.filter(function(x){const t=new Date(x.date).getTime();return t>=a&&t<cutoffNow;});}
  // crude: recompute using a temp shift — reuse computeHealth on a filtered store snapshot is heavy; approximate via deltas of sub-data counts
  return cur;
}

function renderHealthBlock(){
  const collapsed=store.collapsed.health!==false;
  const period=HEALTH_PERIODS.find(function(p){return p.k===healthPeriod;})||HEALTH_PERIODS[2];
  const result=computeHealth(period.days);
  const rating=healthRating(result.composite);
  let h='<div class="card" id="s-health">'+
    blockHeader('health','🩺','ANÁLISIS DE SALUD','Análisis de Salud')+
    '<div class="collapsible'+(collapsed?' collapsed':'')+'">';
  if(!result.hasData){
    h+='<div class="empty-state" style="margin-top:8px">Registra datos de sueño, actividad, ayuno, sol o meditación para generar tu análisis de salud integrativa.</div>';
    h+='</div></div>';
    return h;
  }
  // Period selector
  h+='<div class="health-period-tabs">'+
    HEALTH_PERIODS.map(function(p){return '<button class="health-period-tab '+(p.k===healthPeriod?'active':'')+'" onclick="setHealthPeriod(\''+p.k+'\')">'+p.l+'</button>';}).join('')+
  '</div>';
  // Composite score
  h+='<div style="text-align:center;padding:8px 0 12px">'+
    '<div style="font-size:30px">'+rating.emoji+'</div>'+
    '<div style="font-family:var(--display);font-size:52px;font-weight:400;font-style:italic;color:'+rating.color+';line-height:1;letter-spacing:-2px">'+result.composite+'</div>'+
    '<div style="font-size:13px;font-weight:600;color:'+rating.color+';text-transform:uppercase;letter-spacing:1.5px;font-family:var(--sans);margin-top:2px">'+rating.label+'</div>'+
    '<div style="font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-top:2px;font-family:var(--sans)">Índice de salud integrativa · '+period.l+'</div>'+
  '</div>';
  // Domain breakdown
  h+='<div class="sub-section-label">📊 POR ÁREAS (tú vs óptimo)</div>';
  result.domains.forEach(function(d){
    const dr=healthRating(d.score);
    h+='<div class="health-metric-row">'+
      '<span class="health-metric-label">'+d.icon+' '+d.name+'<br><span style="font-size:9px;color:var(--text-dim)">'+d.value+' · óptimo: '+d.optimal+'</span></span>'+
      '<div class="health-metric-bar"><div class="health-metric-fill" style="width:'+d.score+'%;background:'+dr.color+'"></div></div>'+
      '<span class="health-metric-val" style="color:'+dr.color+'">'+d.score+'</span>'+
    '</div>';
  });
  // Advice: best & worst areas
  const sorted=result.domains.slice().sort(function(a,b){return a.score-b.score;});
  const worst=sorted[0],best=sorted[sorted.length-1];
  if(worst&&worst.score<70){
    const tips={'Sueño':'Prioriza 7-9h y una rutina constante; luz solar al despertar y oscuridad nocturna mejoran tu HRV.','Actividad':'Apunta a 4-6 sesiones semanales combinando fuerza y cardio.','Ayuno':'Una ventana de ayuno de 14-16h favorece la autofagia y sensibilidad a la insulina.','Sol / Vit D':'Exponte al sol con regularidad (con cabeza) para mantener buena vitamina D.','Meditación':'Sesiones cortas diarias de respiración 4:6 reducen el estrés y suben el HRV.','Alergia':'Identifica y reduce desencadenantes; consulta si los síntomas persisten.','VO₂ Max':'El cardio de intensidad (intervalos) es lo que más sube el VO₂max.'};
    h+='<div class="health-advice '+(worst.score<42?'bad':'warn')+'">⚠️ <b>Área a mejorar — '+worst.name+':</b> '+(tips[worst.name]||'Dedica más atención a esta área.')+'</div>';
  }
  if(best&&best.score>=80){
    h+='<div class="health-advice">✅ <b>Vas muy bien en '+best.name+'</b> ('+best.score+'/100). ¡Sigue así!</div>';
  }
  if(result.composite>=80){
    h+='<div class="health-advice">🌟 Tu salud integrativa está en muy buen nivel. Mantén la constancia.</div>';
  }
  // Chart access
  h+='<button class="chart-icon-btn" style="margin-top:10px;width:100%" onclick="openHealthChart()">📈 COMPARAR PROMEDIOS POR ÁREA</button>';
  h+='</div></div>';
  return h;
}
function setHealthPeriod(k){healthPeriod=k;render();}

  const period=HEALTH_PERIODS.find(function(p){return p.k===healthPeriod;})||HEALTH_PERIODS[2];
  const result=computeHealth(period.days);
  openModal('chart');
  const titleEl=document.getElementById('chartModalTitle');
  if(titleEl)titleEl.textContent='Salud por áreas · '+period.l;

<script>
// Sleep tab removed: sleep is now a block inside Estado.
// Redirect any stale showTab('sueno') calls to Estado.
function renderSueno(c){currentTab='estado';showTab('estado');}
// Garmin-inspired sleep evaluation. Garmin sleep score (0-100) weights:
// deep+REM duration, total duration, restlessness, awakenings, and recovery (HRV/RHR).
// We derive a composite from the 4 fields the app tracks.
function evalSleep(s){
  const hrv=parseFloat(s.hrv)||0;
  const hours=parseFloat(s.hours)||0;
  const score=parseFloat(s.score)||0;
  const hr=parseFloat(s.hr)||0;
  // Sub-scores 0-100
  // Duration: optimal 7-9h
  let durScore;
  if(hours>=7&&hours<=9)durScore=100;
  else if(hours>=6&&hours<7)durScore=75+(hours-6)*25;
  else if(hours>9&&hours<=10)durScore=90;
  else if(hours>=5&&hours<6)durScore=50+(hours-5)*25;
  else if(hours>10)durScore=75;
  else durScore=Math.max(10,hours*10);
  // HRV: higher is better (relative). 20=poor,40=fair,60=good,80+=excellent
  let hrvScore;
  if(hrv>=70)hrvScore=100;else if(hrv>=50)hrvScore=80+(hrv-50)*1;else if(hrv>=35)hrvScore=60+(hrv-35)*1.33;else if(hrv>=20)hrvScore=35+(hrv-20)*1.67;else hrvScore=Math.max(10,hrv*1.75);
  // Resting HR at night: lower is better. <50 excellent, 50-60 good, 60-70 fair, >70 poor
  let hrScore;
  if(hr<=0)hrScore=null;else if(hr<48)hrScore=100;else if(hr<=55)hrScore=85;else if(hr<=62)hrScore=70;else if(hr<=70)hrScore=50;else hrScore=Math.max(15,100-(hr-50)*2);
  // Garmin device score if provided is trustworthy; blend it in heavily
  const parts=[];
  parts.push({w:0.3,v:durScore});
  parts.push({w:0.3,v:hrvScore});
  if(hrScore!=null)parts.push({w:0.15,v:hrScore});
  if(score>0)parts.push({w:0.5,v:score}); // device score dominates if present
  let tw=0,acc=0;parts.forEach(function(p){tw+=p.w;acc+=p.w*p.v;});
  const composite=Math.round(acc/tw);
  let rating,color,emoji;
  if(composite>=90){rating='Excelente';color='#34d399';emoji='🌟';}
  else if(composite>=80){rating='Muy bueno';color='#a7f3d0';emoji='😴';}
  else if(composite>=70){rating='Bueno';color='#fbbf24';emoji='🙂';}
  else if(composite>=55){rating='Regular';color='#fb923c';emoji='😐';}
  else{rating='Deficiente';color='#f87171';emoji='😴';}
  return {composite:composite,rating:rating,color:color,emoji:emoji,durScore:Math.round(durScore),hrvScore:Math.round(hrvScore),hrScore:hrScore!=null?Math.round(hrScore):null};
}

function addSleep(){
  const s={id:Date.now(),date:document.getElementById('sleepDate').value,hrv:document.getElementById('sleepHRV').value,hours:document.getElementById('sleepHours').value,score:document.getElementById('sleepScore').value,hr:document.getElementById('sleepHR').value};
  if(!s.date)return alert('Selecciona fecha');
  if(dateExists('sleep',s.date))return warnDuplicate('sueño');
  store.sleep.push(s);save('sleep',store.sleep);
  showSleepEval(s);
  render();
}

function showSleepEvalById(id){
  const s=store.sleep.find(function(x){return x.id===id;});
  if(s)showSleepEval(s);
}
function showSleepEval(s){
  const ev=evalSleep(s);
  let advice='';
  if(ev.durScore<70)advice+='Intenta dormir 7-9h. ';
  if(ev.hrvScore<60)advice+='Tu HRV está bajo: reduce alcohol/cafeína nocturna y estrés. ';
  if(ev.hrScore!=null&&ev.hrScore<60)advice+='Tu FC nocturna es algo alta: evita comidas copiosas y ejercicio intenso antes de dormir. ';
  if(!advice)advice='¡Buen descanso! Mantén tus hábitos de sueño.';
  const tip='<div style="font-size:10.5px;color:var(--text-dim);font-style:italic;font-family:var(--serif);margin-top:8px;line-height:1.45">'+advice+'</div>';
  const body='<div style="text-align:center;padding:6px 0 10px">'+
    '<div style="font-size:34px">'+ev.emoji+'</div>'+
    '<div style="font-family:var(--display);font-size:46px;font-weight:400;font-style:italic;color:'+ev.color+';line-height:1;letter-spacing:-2px">'+ev.composite+'</div>'+
    '<div style="font-size:13px;font-weight:600;color:'+ev.color+';text-transform:uppercase;letter-spacing:1px;font-family:var(--sans);margin-top:2px">'+ev.rating+'</div>'+
  '</div>'+
  '<div class="health-metric-row"><span class="health-metric-label">Duración ('+fmtDuration(s.hours)+')</span><div class="health-metric-bar"><div class="health-metric-fill" style="width:'+ev.durScore+'%;background:'+(ev.durScore>=70?'#34d399':ev.durScore>=50?'#fbbf24':'#f87171')+'"></div></div><span class="health-metric-val" style="color:'+(ev.durScore>=70?'#34d399':ev.durScore>=50?'#fbbf24':'#f87171')+'">'+ev.durScore+'</span></div>'+
  '<div class="health-metric-row"><span class="health-metric-label">HRV ('+s.hrv+' ms)</span><div class="health-metric-bar"><div class="health-metric-fill" style="width:'+ev.hrvScore+'%;background:'+(ev.hrvScore>=60?'#34d399':ev.hrvScore>=40?'#fbbf24':'#f87171')+'"></div></div><span class="health-metric-val" style="color:'+(ev.hrvScore>=60?'#34d399':ev.hrvScore>=40?'#fbbf24':'#f87171')+'">'+ev.hrvScore+'</span></div>'+
  (ev.hrScore!=null?'<div class="health-metric-row"><span class="health-metric-label">FC nocturna ('+s.hr+' bpm)</span><div class="health-metric-bar"><div class="health-metric-fill" style="width:'+ev.hrScore+'%;background:'+(ev.hrScore>=60?'#34d399':ev.hrScore>=50?'#fbbf24':'#f87171')+'"></div></div><span class="health-metric-val" style="color:'+(ev.hrScore>=60?'#34d399':ev.hrScore>=50?'#fbbf24':'#f87171')+'">'+ev.hrScore+'</span></div>':'')+
  tip;
  const titleEl=document.getElementById('sleepEvalTitle');
  if(titleEl)titleEl.textContent='Valoración del sueño · '+fmtDate(s.date);
  const bodyEl=document.getElementById('sleepEvalBody');
  if(bodyEl)bodyEl.innerHTML=body;
  openModal('sleepEval');
}

function setActType(t){actType=t;render();}
function addActivity(){const a={id:Date.now(),type:actType,date:document.getElementById('actDate').value,subtype:(document.getElementById('actSubtype')||{}).value||'',duration:(document.getElementById('actDuration')||{}).value||'',result:(document.getElementById('actResult')||{}).value||'',distance:(document.getElementById('actDistance')||{}).value||'',hrAvg:(document.getElementById('actHRavg')||{}).value||'',hrMax:(document.getElementById('actHRmax')||{}).value||'',notes:(document.getElementById('actNotes')||{}).value||''};if(!a.date)return alert('Selecciona fecha');store.activity.push(a);save('activity',store.activity);render();}
function addWod(){const name=document.getElementById('wodName').value;const desc=document.getElementById('wodDesc').value;if(!name||!desc)return alert('Completa');store.wods.push({name:name,desc:desc});save('wods',store.wods);render();}
function addRecord(){const name=document.getElementById('recName').value;const value=document.getElementById('recValue').value;const date=document.getElementById('recDate').value;if(!name||!value)return alert('Completa');store.records.push({id:Date.now(),name:name,value:value,date:date,video:recVideoData||null});recVideoData=null;save('records',store.records);render();}
let recVideoData=null;
function handleRecVideo(e){
  const file=e.target.files[0];if(!file)return;
  const ic=document.getElementById('recVideoIcon');
  if(ic)ic.textContent='⏳';
  // Store the raw blob in IndexedDB (handles large iPhone clips >1min)
  saveVideoBlob(file).then(function(ref){
    recVideoData=ref;
    if(ic){ic.textContent='✓';const a=document.getElementById('recVideoArea');if(a)a.classList.add('has-video');}
  }).catch(function(err){
    console.warn('video save failed',err);
    if(ic)ic.textContent='🎬';
    alert('No se pudo guardar el vídeo. Inténtalo de nuevo.');
  });
}

function handleDayImage(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    const img=new Image();
    img.onload=function(){
      const canvas=document.createElement('canvas');
      const maxDim=1024;
      let w=img.width,h=img.height;
      if(w>h&&w>maxDim){h=h*(maxDim/w);w=maxDim;}
      else if(h>maxDim){w=w*(maxDim/h);h=maxDim;}
      canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      editingImageData=canvas.toDataURL('image/jpeg',0.82);
      refreshDayImagePreview();
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

        (musicVolOpen?'<input type="range" class="med-vol-slider" min="0" max="100" value="'+Math.round((store.settings.musicVolume!=null?store.settings.musicVolume:0.5)*100)+'" oninput="setMusicVolume(this.value)">':'')+
        '<button class="med-actrl-btn" onclick="cycleMusic()" title="Cambiar música">🎼<span class="med-actrl-tag">'+(MUSIC_TRACKS[store.settings.musicTrack||0].short)+'</span></button>'+
        '<div class="med-actrl-divider"></div>'+

        '<button class="med-actrl-btn" onclick="toggleBellVol()" title="Volumen campana">'+(bellVolOpen?'🔉':'🔈')+'</button>'+

        '<button class="med-actrl-btn" onclick="cycleBell()" title="Cambiar campana">🎵<span class="med-actrl-tag">'+(BELL_TYPES[store.settings.bellType||0].short)+'</span></button>'+
      '</div>'+

            '<div class="breath-ring breath-ring-2"></div>'+

          '</div>'+
          '<div class="breath-ref-inner"></div>'+
          '<div class="breath-orb '+medOrbState+(inExhale?' exhale-color':'')+'" id="breathOrb" style="--inhale-time:'+medConfig.inhale+'s;--exhale-time:'+medConfig.exhale+'s"></div>'+
          '<div class="countdown-overlay" id="countdownOverlay" style="display:none">'+
            '<div class="countdown-number" id="countdownNumber">3</div>'+
            '<div class="countdown-prep" id="countdownPrep">EMPEZAREMOS INHALANDO</div>'+

        '<div class="timer-display" id="medTimer">'+fmtTime(medState==='idle'?medConfig.total:medTimeLeft)+'</div>'+
        '<div class="timer-phase '+(inExhale?'active-exhale':(medState==='running'?'active':''))+'" id="medPhase">'+(medPhaseLabel||(medState==='running'?'COMENZANDO...':'LISTO PARA COMENZAR'))+'</div>'+
      '</div>'+

      // 4 columns, all equal height - duración (min:seg), inhalar, exhalar, preparación
      '<div class="med-input-row">'+
        '<div class="med-input-cell">'+
          '<label>DURACIÓN</label>'+
          '<div class="med-time-input">'+
            '<input type="number" id="medMins" value="'+mins+'" min="0" max="60" onchange="updateMedConfig()">'+
            '<span>:</span>'+
            '<input type="number" id="medSecs" value="'+secs+'" min="0" max="59" onchange="updateMedConfig()">'+
          '</div>'+
        '</div>'+
        '<div class="med-input-cell">'+
          '<label>INHALAR</label>'+
          '<div class="med-num-input"><input type="number" id="medInhale" value="'+medConfig.inhale+'" min="1" max="30" onchange="updateMedConfig()"><span>s</span></div>'+
        '</div>'+
        '<div class="med-input-cell">'+
          '<label>EXHALAR</label>'+
          '<div class="med-num-input"><input type="number" id="medExhale" value="'+medConfig.exhale+'" min="1" max="30" onchange="updateMedConfig()"><span>s</span></div>'+
        '</div>'+
        '<div class="med-input-cell">'+
          '<label>PREP.</label>'+
          '<div class="med-num-input"><input type="number" id="medCountdown" value="'+medConfig.countdown+'" min="0" max="10" onchange="updateMedConfig()"><span>s</span></div>'+
        '</div>'+
      '</div>'+

      '<div class="med-controls">'+
        (medState==='running'||medState==='paused'||medState==='countdown'?
          '<button class="btn btn-secondary" onclick="resetMed()">⟲ REINICIAR</button>'+
          '<button class="btn btn-primary" id="medBtn" onclick="toggleMed()">'+(medState==='paused'?'▶ REANUDAR':'⏸ PAUSAR')+'</button>':
          '<button class="btn btn-primary" id="medBtn" onclick="toggleMed()" style="flex:1">▶ COMENZAR</button>'
        )+
      '</div>'+
    '</div>';

  // Saved programs (collapsed by default)
  h+='<div class="card">'+
    '<div class="card-title" onclick="toggleEstadoBlock(\'medprog\')"><div class="card-title-text"><span>💾 PROGRAMAS</span></div><button class="collapse-btn">'+(store.collapsed.medprog?'▼':'▲')+'</button></div>'+
    '<div class="collapsible'+(store.collapsed.medprog?' collapsed':'')+'">'+
      '<div class="row-with-add" style="margin-top:6px">'+
        '<div class="input-group"><label>NOMBRE</label><input type="text" id="progName" placeholder="Mañana relajante"></div>'+
        '<button class="add-btn" onclick="saveProgram()" title="Guardar configuración">+</button>'+
      '</div>'+
      (store.programs.length?'<div class="prog-list">'+store.programs.map(function(p){
        return '<button class="prog-btn" onclick="loadProgram('+p.id+')">'+
          '<span class="prog-btn-play">▶</span>'+
          '<span class="prog-btn-body">'+
            '<span class="prog-btn-name">'+escapeHTML(p.name)+'</span>'+
            '<span class="prog-btn-meta">'+fmtTime(p.total)+' · inhalar '+p.inhale+'s / exhalar '+p.exhale+'s</span>'+
          '</span>'+
          '<span class="prog-btn-del" onclick="event.stopPropagation();delItem(\'programs\','+p.id+')" title="Eliminar">✕</span>'+

  if(store.meditation.length){

      },{chartLabel:'Meditación (s)',chartKey:'duration',chartColor:'#c084fc'})+
