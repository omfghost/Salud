function fmtTime(s){const m=Math.floor(s/60);const sec=s%60;return m+':'+sec.toString().padStart(2,'0');}

function updateMedConfig(){
  const mins=parseInt((document.getElementById('medMins')||{}).value)||0;
  const secs=parseInt((document.getElementById('medSecs')||{}).value)||0;
  medConfig.total=mins*60+secs;
  if(medConfig.total<10)medConfig.total=10;
  medConfig.inhale=parseInt((document.getElementById('medInhale')||{}).value)||4;
  medConfig.exhale=parseInt((document.getElementById('medExhale')||{}).value)||6;
  medConfig.countdown=parseInt((document.getElementById('medCountdown')||{}).value)||0;
  if(medState==='idle'){
    medTimeLeft=medConfig.total;
    const td=document.getElementById('medTimer');
    if(td)td.textContent=fmtTime(medConfig.total);
  }
  const orb=document.getElementById('breathOrb');
  if(orb){orb.style.setProperty('--inhale-time',medConfig.inhale+'s');orb.style.setProperty('--exhale-time',medConfig.exhale+'s');}
}

function toggleMed(){
  // Create + resume audio context SYNCHRONOUSLY inside the user gesture (iOS requirement)
  try{
    const ctx=getAudioCtx();
    if(ctx&&ctx.state==='suspended')ctx.resume();
    // Play a tiny silent buffer to fully unlock on iOS
    if(ctx){const b=ctx.createBuffer(1,1,22050);const s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);s.start(0);}
  }catch(e){}
  if(medState==='idle'){
    if(medConfig.countdown>0)startCountdown();else startMeditation();
  }else if(medState==='running')pauseMeditation();
  else if(medState==='paused')resumeMeditation();
}

function startCountdown(){
  requestWakeLock();
  medState='countdown';
  medCountdownVal=medConfig.countdown;
  const overlay=document.getElementById('countdownOverlay');
  const num=document.getElementById('countdownNumber');
  const prep=document.getElementById('countdownPrep');
  if(overlay){overlay.style.display='flex';num.textContent=medCountdownVal;}
  if(prep)prep.textContent='EMPEZAREMOS INHALANDO';
  medPhaseLabel='PREPARÁNDOSE...';
  const phase=document.getElementById('medPhase');
  if(phase){phase.textContent=medPhaseLabel;phase.classList.remove('active','active-exhale');}
  updateMedControls();
  playChime(0.3);
  medTimer=setInterval(function(){
    medCountdownVal--;
    if(medCountdownVal<=0){
      clearInterval(medTimer);
      if(overlay)overlay.style.display='none';
      startMeditation();
    }else{
      if(num){num.textContent=medCountdownVal;num.style.animation='none';void num.offsetWidth;num.style.animation='countPulse 1s ease';}
      playChime(0.25);
    }
  },1000);
}

function updateMedControls(){
  const ctrl=document.querySelector('.med-controls');
  if(!ctrl)return;
  if(medState==='running'||medState==='countdown'){
    ctrl.innerHTML='<button class="btn btn-secondary" onclick="resetMed()">⟲ REINICIAR</button>'+
      '<button class="btn btn-primary" id="medBtn" onclick="toggleMed()">⏸ PAUSAR</button>';
  }else if(medState==='paused'){
    ctrl.innerHTML='<button class="btn btn-secondary" onclick="resetMed()">⟲ REINICIAR</button>'+
      '<button class="btn btn-primary" id="medBtn" onclick="toggleMed()">▶ REANUDAR</button>';
  }else{
    ctrl.innerHTML='<button class="btn btn-primary" id="medBtn" onclick="toggleMed()" style="flex:1">▶ COMENZAR</button>';
  }
}

function startMeditation(){
  requestWakeLock();
  medState='running';
  medTimeLeft=medConfig.total;
  medCycleTime=0;
  medOrbState='inhale';
  if(store.settings.music)startBgMusic();
  playBell(0.45);
  const orb=document.getElementById('breathOrb');
  if(orb){orb.classList.remove('hold','exhale','exhale-color');void orb.offsetWidth;orb.classList.add('inhale');}
  medPhaseLabel='INHALA ('+medConfig.inhale+'S)';
  const phase=document.getElementById('medPhase');
  if(phase){phase.textContent=medPhaseLabel;phase.classList.add('active');phase.classList.remove('active-exhale');}
  updateMedControls();
  medTimer=setInterval(medTick,1000);
}

function medTick(){
  medTimeLeft--;
  medCycleTime++;
  const cycle=medConfig.inhale+medConfig.exhale;
  const inCycle=medCycleTime%cycle;
  const phaseEl=document.getElementById('medPhase');
  const orb=document.getElementById('breathOrb');
  if(inCycle===1&&medCycleTime>1){
    // Transition to inhale
    medOrbState='inhale';
    if(orb){orb.classList.remove('exhale','hold','exhale-color');void orb.offsetWidth;orb.classList.add('inhale');}
    medPhaseLabel='INHALA ('+medConfig.inhale+'S)';
    if(phaseEl){phaseEl.textContent=medPhaseLabel;phaseEl.classList.remove('active-exhale');phaseEl.classList.add('active');}
    if(store.settings.transitionSound)playChime(0.3);
  }else if(inCycle===medConfig.inhale+1){
    // Transition to exhale
    medOrbState='exhale';
    if(orb){orb.classList.remove('inhale','hold');void orb.offsetWidth;orb.classList.add('exhale','exhale-color');}
    medPhaseLabel='EXHALA ('+medConfig.exhale+'S)';
    if(phaseEl){phaseEl.textContent=medPhaseLabel;phaseEl.classList.remove('active');phaseEl.classList.add('active-exhale');}
    if(store.settings.transitionSound)playChimeLow(0.3);
  }
  const td=document.getElementById('medTimer');
  if(td)td.textContent=fmtTime(medTimeLeft);
  if(medTimeLeft<=0)finishMeditation();
}

function pauseMeditation(){
  // Preserve time and orb position without losing state
  medState='paused';
  clearInterval(medTimer);
  stopBgMusic();
  medPhaseLabel='⏸ PAUSADO';
  const phase=document.getElementById('medPhase');
  if(phase){phase.textContent=medPhaseLabel;phase.classList.remove('active','active-exhale');}
  // Freeze orb at its CURRENT visual position: capture computed transform and apply it inline,
  // then remove animation classes so it stays still until resumed
  const orb=document.getElementById('breathOrb');
  if(orb){
    try{
      const cs=window.getComputedStyle(orb);
      const transform=cs.transform&&cs.transform!=='none'?cs.transform:'';
      orb.style.animationPlayState='paused';
      // Also freeze using inline transform fallback
      if(transform)orb.style.transform=transform;
      // Keep exhale-color class if currently exhaling so the violet stays visible
    }catch(e){}
  }
  // Re-render to show ⟲ + REANUDAR buttons WITHOUT calling render() (that wipes the DOM and would reset orb)
  // Instead update controls in place:
  updateMedControls();
}

function resumeMeditation(){
  medState='running';
  if(store.settings.music)startBgMusic();
  const orb=document.getElementById('breathOrb');
  if(orb){
    // Clear inline overrides applied during pause
    orb.style.transform='';
    orb.style.animationPlayState='';
    // Restart the animation matching current breath state (resume animation from current scale via re-trigger)
    const cycle=medConfig.inhale+medConfig.exhale;
    const inCycle=medCycleTime%cycle;
    if(inCycle===0||inCycle<=medConfig.inhale){
      medOrbState='inhale';
      orb.classList.remove('hold','exhale','exhale-color');
      void orb.offsetWidth;
      orb.classList.add('inhale');
      medPhaseLabel='INHALA ('+medConfig.inhale+'S)';
    }else{
      medOrbState='exhale';
      orb.classList.remove('hold','inhale');
      void orb.offsetWidth;
      orb.classList.add('exhale','exhale-color');
      medPhaseLabel='EXHALA ('+medConfig.exhale+'S)';
    }
  }
  const phase=document.getElementById('medPhase');
  if(phase){
    phase.textContent=medPhaseLabel;
    if(medOrbState==='exhale'){phase.classList.remove('active');phase.classList.add('active-exhale');}
    else{phase.classList.remove('active-exhale');phase.classList.add('active');}
  }
  medTimer=setInterval(medTick,1000);
  updateMedControls();
}

function resetMed(){
  releaseWakeLock();
  clearInterval(medTimer);
  stopBgMusic();
  medState='idle';
  medTimeLeft=medConfig.total;
  medCycleTime=0;
  medOrbState='hold';
  medPhaseLabel='';
  const overlay=document.getElementById('countdownOverlay');
  if(overlay)overlay.style.display='none';
  render();
}

function finishMeditation(){
  releaseWakeLock();
  clearInterval(medTimer);
  stopBgMusic();
  playBell(0.5);
  setTimeout(function(){playBell(0.3);},900);
  medState='idle';
  medPhaseLabel='✨ SESIÓN COMPLETA';
  const phase=document.getElementById('medPhase');
  if(phase){phase.textContent=medPhaseLabel;phase.classList.add('active');phase.classList.remove('active-exhale');}
  const orb=document.getElementById('breathOrb');
  if(orb){orb.classList.remove('inhale','exhale','exhale-color');orb.classList.add('hold');}
  store.meditation.push({id:Date.now(),date:today(),duration:medConfig.total,inhale:medConfig.inhale,exhale:medConfig.exhale,value:medConfig.total});
  save('meditation',store.meditation);
  setTimeout(function(){if(currentTab==='meditacion')render();},2000);
}

// Music tracks (different frequency sets) and bell types

function toggleMusicVol(){musicVolOpen=!musicVolOpen;bellVolOpen=false;render();}
function toggleBellVol(){bellVolOpen=!bellVolOpen;musicVolOpen=false;render();}
function setMusicVolume(v){store.settings.musicVolume=parseInt(v)/100;saveSettings();if(bgNodes&&bgNodes.master){try{bgNodes.master.gain.value=store.settings.musicVolume*0.12;}catch(e){}}}
function setBellVolume(v){store.settings.bellVolume=parseInt(v)/100;saveSettings();}
function cycleMusic(){const cur=store.settings.musicTrack||0;store.settings.musicTrack=(cur+1)%MUSIC_TRACKS.length;saveSettings();if(store.settings.music&&medState==='running'){stopBgMusic();startBgMusic();}render();}
function cycleBell(){const cur=store.settings.bellType||0;store.settings.bellType=(cur+1)%BELL_TYPES.length;saveSettings();playBell(store.settings.bellVolume!=null?store.settings.bellVolume:0.4);render();}

function toggleMusic(el){store.settings.music=!store.settings.music;if(el){el.classList.toggle('on');el.classList.toggle('off');}saveSettings();if(store.settings.music&&medState==='running')startBgMusic();else if(!store.settings.music)stopBgMusic();}
function toggleTransSound(el){store.settings.transitionSound=!store.settings.transitionSound;if(el){el.classList.toggle('on');el.classList.toggle('off');}saveSettings();}
function saveProgram(){const name=document.getElementById('progName').value;if(!name)return alert('Pon nombre');store.programs.push({id:Date.now(),name:name,total:medConfig.total,inhale:medConfig.inhale,exhale:medConfig.exhale,countdown:medConfig.countdown});save('programs',store.programs);render();}
function loadProgram(id){
  const p=store.programs.find(function(x){return x.id===id;});
  if(!p)return;
  // Stop anything running and reset to idle with the program's config
  if(medState!=='idle'){resetMed();}
  medConfig={total:p.total,inhale:p.inhale,exhale:p.exhale,countdown:p.countdown||3};
  medTimeLeft=medConfig.total;
  medState='idle';
  render();
  // After render, update orb CSS vars + scroll the breathing screen into view
  setTimeout(function(){
    const orb=document.getElementById('breathOrb');
    if(orb){orb.style.setProperty('--inhale-time',medConfig.inhale+'s');orb.style.setProperty('--exhale-time',medConfig.exhale+'s');}
    const screen=document.querySelector('.med-screen');
    if(screen)screen.scrollIntoView({behavior:'smooth',block:'center'});
  },60);
}
</script>

<script>
// ============= SOL =============
let sunTimerInterval=null;
let sunTimeStart=null;
let sunSessionVitD=0;

// Get HTML for a single sol block by id (reorderable)
// Inner content of the skin/clothing/age section (reused inside Vit D block)

    '<div style="font-size:9px;color:#888;font-style:italic;font-family:var(--serif);margin-top:4px;line-height:1.4">La síntesis de vitamina D disminuye ~13% por década a partir de los 20 años (depleción de 7-dehidrocolesterol cutáneo).</div>';
}

function getSolBlock(id,times,currentHour,uv,uva,uvb,isDay){
  // ENVIRONMENT (Clima + Ubicación fusionados)
  if(id==='environment'){
    const autoW=store.settings.autoWeather;

    const solUV=uv;
    const uvColor=solUV>=8?'#dc2626':solUV>=6?'#f59e0b':solUV>=3?'#fbbf24':solUV>=1?'#a7f3d0':'#475569';

      '<div class="card-title" onclick="toggleEstadoBlock(\'environment\')"><div class="card-title-text"><span>🌍 ENTORNO <button class="help-icon" onclick="event.stopPropagation();showTerm(\'Clima\')">?</button></span></div><button class="collapse-btn">'+(store.collapsed.environment?'▼':'▲')+'</button></div>'+
      '<div class="collapsible'+(store.collapsed.environment?' collapsed':'')+'">'+

          '<button class="env-loc-btn" onclick="refreshGeo()" title="Actualizar ubicación">📍</button>'+
          '<div class="toggle '+(store.settings.autoLocation?'active':'')+'" onclick="toggleAutoLoc(this)"><div class="toggle-handle"></div></div>'+
        '</div>'+
        (!store.settings.autoLocation?'<div class="grid-2" style="margin-top:5px"><div class="input-group"><label>LAT</label><input type="number" step="0.0001" id="manLat" value="'+store.settings.lat+'" onchange="updateManLoc()"></div><div class="input-group"><label>LNG</label><input type="number" step="0.0001" id="manLng" value="'+store.settings.lng+'" onchange="updateManLoc()"></div></div>':'')+
        '<div class="env-divider"></div>'+
        // Weather: always-on label, just shows detected + toggle to switch manual
        '<div class="env-loc-row">'+
          '<span class="sub-section-label" style="margin:0;flex:0 0 auto">🌤️ CLIMA</span>'+
          (autoW?'<span style="font-size:13px;margin-left:4px">'+(WEATHER_PRESETS[store.settings.weather||'soleado'].icon)+'</span><span style="color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:0.6px;font-size:10px">'+WEATHER_PRESETS[store.settings.weather||'soleado'].name+'</span>':'<span style="font-size:9px;color:var(--text-dim)">Manual</span>')+
          '<div class="toggle '+(autoW?'active':'')+'" onclick="toggleAutoWeather(this)" style="margin-left:auto"><div class="toggle-handle"></div></div>'+
        '</div>'+
        (!autoW?'<div class="weather-tabs" style="margin-top:5px">'+
          Object.entries(WEATHER_PRESETS).map(function(entry){
            const k=entry[0],w=entry[1];
            const active=(store.settings.weather||'soleado')===k;
            return '<button class="weather-tab '+(active?'active':'')+'" onclick="setWeather(\''+k+'\')"><span>'+w.icon+'</span>'+w.name.toUpperCase()+'</button>';
          }).join('')+'</div>':'')+
        // SOL / UVA / UVB chips - all on one line, small
        '<div class="env-uv-row">'+
          '<div class="env-uv-chip" style="border-color:'+uvColor+'33"><span style="color:'+uvColor+'">SOL</span><b style="color:'+uvColor+'">UV '+solUV.toFixed(1)+'</b></div>'+
          '<div class="env-uv-chip" style="border-color:rgba(96,165,250,0.25)"><span style="color:#60a5fa">UVA</span><b style="color:#60a5fa">'+uva.toFixed(1)+'</b></div>'+
          '<div class="env-uv-chip" style="border-color:rgba(192,132,252,0.25)"><span style="color:#c084fc">UVB</span><b style="color:#c084fc">'+uvb.toFixed(1)+'</b></div>'+
        '</div>'+
      '</div>'+
    '</div>';
  }
  // SKIN + CLOTHING fused
  if(id==='skinclothing'){
    // (kept for backwards-compat / migration, but normally folded into suntimer now)
    return '<div class="card">'+
      '<div class="card-title" onclick="toggleEstadoBlock(\'skinclothing\')"><div class="card-title-text"><span>🎨 PIEL, ROPA Y EDAD <button class="help-icon" onclick="event.stopPropagation();showTerm(\'TipoPiel\')">?</button></span></div><button class="collapse-btn">'+(store.collapsed.skinclothing?'▼':'▲')+'</button></div>'+
      '<div class="collapsible'+(store.collapsed.skinclothing?' collapsed':'')+'">'+
        skinClothingInner()+
      '</div>'+
    '</div>';
  }
  if(id==='hormones'){
    const sunrise=times.sunrise,noon=times.noon,sunset=times.sunset;
    const cortisolPeak=sunrise+0.5;
    const cortisolMin=sunset-1;
    const melatoninRise=sunset+1.5;
    const melatoninPeak=(sunset+10)%24;
    const lastMealIdeal=sunset-2;
    // Growth hormone: peak during deep sleep (~2-3am)
    const ghPeak=(sunset+8)%24;
    const ghMin=(sunrise+3)%24;
    // Testosterone: peak ~6-8am, min ~evening
    const testoPeak=(sunrise+1.5)%24;
    const testoMin=(sunset+1)%24;
    // Helper for line toggle button
    function lineToggle(hKey,color){
      const active=(store.settings.hormoneLines||{})[hKey]===true;
      return '<button class="hormone-line-btn '+(active?'active':'')+'" onclick="toggleHormoneLine(\''+hKey+'\')" title="Mostrar línea en gráfico">'+(active?'● ':'○ ')+'Ver en gráfico</button>';
    }
    return '<div class="card">'+
      '<div class="card-title" onclick="toggleEstadoBlock(\'hormones\')"><div class="card-title-text"><span>🧬 HORMONAS <button class="help-icon" onclick="event.stopPropagation();showTerm(\'Hormonas\')">?</button></span></div><button class="collapse-btn">'+(store.collapsed.hormones?'▼':'▲')+'</button></div>'+
      '<div class="collapsible'+(store.collapsed.hormones?' collapsed':'')+'">'+
        // Leptin
        '<div class="hormone-block">'+
          '<div class="hormone-header"><span class="hormone-icon">🍽️</span><span class="hormone-name">Leptina</span><button class="help-icon" onclick="showTerm(\'Leptina\')">?</button></div>'+
          '<div class="hormone-desc">Saciedad y regulación energética. Pico nocturno, mínimo matinal.</div>'+
          '<div class="data-row"><span class="data-label">📈 Pico circadiano</span><span class="data-value" style="color:var(--accent)">'+fmtHour((noon+12)%24)+'</span></div>'+
          '<div class="data-row"><span class="data-label">🛑 Última comida ideal</span><span class="data-value" style="color:#fb923c">'+fmtHour(lastMealIdeal)+'</span></div>'+
          lineToggle('leptin','#a7f3d0')+
          '<div class="hormone-tip">💡 Cenar ≥3h antes de dormir mejora sensibilidad a la leptina (Cell Metabolism 2024).</div>'+
        '</div>'+
        // Cortisol
        '<div class="hormone-block">'+
          '<div class="hormone-header"><span class="hormone-icon">⚡</span><span class="hormone-name">Cortisol</span><button class="help-icon" onclick="showTerm(\'Cortisol\')">?</button></div>'+
          '<div class="hormone-desc">Activación, alerta, metabolismo. Pico matinal (CAR), mínimo noche.</div>'+
          '<div class="data-row"><span class="data-label">📈 Pico CAR (despertar+30min)</span><span class="data-value" style="color:#fbbf24">'+fmtHour(cortisolPeak)+'</span></div>'+
          '<div class="data-row"><span class="data-label">📉 Nadir (mínimo)</span><span class="data-value" style="color:var(--accent)">'+fmtHour(cortisolMin)+'</span></div>'+
          lineToggle('cortisol','#fbbf24')+
          '<div class="hormone-tip">💡 Luz solar 5-10 min al despertar potencia el CAR. Café ≥90 min tras despertar.</div>'+
        '</div>'+
        // Melatonin
        '<div class="hormone-block">'+
          '<div class="hormone-header"><span class="hormone-icon">🌙</span><span class="hormone-name">Melatonina</span><button class="help-icon" onclick="showTerm(\'Melatonina\')">?</button></div>'+
          '<div class="hormone-desc">Hormona del sueño. Se inhibe con luz, sube en oscuridad.</div>'+
          '<div class="data-row"><span class="data-label">🌅 DLMO (inicio nocturno)</span><span class="data-value" style="color:#c084fc">'+fmtHour(melatoninRise)+'</span></div>'+
          '<div class="data-row"><span class="data-label">🌌 Pico nocturno</span><span class="data-value" style="color:#c084fc">'+fmtHour(melatoninPeak)+'</span></div>'+
          lineToggle('melatonin','#c084fc')+
          '<div class="hormone-tip">💡 Luz ≤10 lux 1h antes de dormir. Suplemento fisiológico: 0.3-0.5 mg.</div>'+
        '</div>'+
        // Growth hormone
        '<div class="hormone-block">'+
          '<div class="hormone-header"><span class="hormone-icon">🌱</span><span class="hormone-name">Hormona del crecimiento (GH)</span></div>'+
          '<div class="hormone-desc">Regeneración tisular, reparación. Pico durante el sueño profundo (~2-3am).</div>'+
          '<div class="data-row"><span class="data-label">📈 Pico (sueño profundo)</span><span class="data-value" style="color:#60a5fa">'+fmtHour(ghPeak)+'</span></div>'+
          '<div class="data-row"><span class="data-label">📉 Nivel basal</span><span class="data-value" style="color:var(--text-dim)">'+fmtHour(ghMin)+'</span></div>'+
          lineToggle('gh','#60a5fa')+
          '<div class="hormone-tip">💡 Ayuno y ejercicio HIIT estimulan GH. Dormir antes de las 23h maximiza el pico.</div>'+
        '</div>'+
        // Testosterone
        '<div class="hormone-block">'+
          '<div class="hormone-header"><span class="hormone-icon">🔥</span><span class="hormone-name">Testosterona</span></div>'+
          '<div class="hormone-desc">Anabolismo, libido, energía. Máximo matinal (~7-8am), declina por la tarde.</div>'+
          '<div class="data-row"><span class="data-label">📈 Pico matinal</span><span class="data-value" style="color:#f87171">'+fmtHour(testoPeak)+'</span></div>'+
          '<div class="data-row"><span class="data-label">📉 Mínimo vespertino</span><span class="data-value" style="color:var(--text-dim)">'+fmtHour(testoMin)+'</span></div>'+
          lineToggle('testosterone','#f87171')+
          '<div class="hormone-tip">💡 Entrenamiento de fuerza, sueño 7-9h, exposición al sol y zinc favorecen niveles óptimos.</div>'+
        '</div>'+
      '</div>'+
    '</div>';
  }
  if(id==='suntimer'){
    // Aggregate vit D totals from store.sun records
    const todayStr=today();
    const monthStr=todayStr.substring(0,7); // YYYY-MM
    const yearStr=todayStr.substring(0,4);  // YYYY
    let totalDay=0,totalMonth=0,totalYear=0,totalAll=0;
    store.sun.forEach(function(s){
      const v=parseFloat(s.vitd)||0;
      if(s.date===todayStr)totalDay+=v;
      if(s.date&&s.date.substring(0,7)===monthStr)totalMonth+=v;
      if(s.date&&s.date.substring(0,4)===yearStr)totalYear+=v;
      totalAll+=v;
    });
    const baseline=parseFloat(store.settings.vitDBaseline||0);
    const estimateActual=baseline+totalAll;
    return '<div class="card">'+
      '<div class="card-title" onclick="toggleEstadoBlock(\'suntimer\')"><div class="card-title-text"><span>☀️ VITD - EXPOSICIÓN <button class="help-icon" onclick="event.stopPropagation();showTerm(\'Vitamina D\')">?</button></span></div><button class="collapse-btn">'+(store.collapsed.suntimer?'▼':'▲')+'</button></div>'+
      '<div class="collapsible'+(store.collapsed.suntimer?' collapsed':'')+'">'+

            '<span class="vitd-accum-title">🎨 Piel, ropa y edad</span>'+
            '<button class="collapse-btn">'+(store.collapsed.skinclothing?'▼':'▲')+'</button>'+
          '</div>'+
          '<div class="collapsible'+(store.collapsed.skinclothing?' collapsed':'')+'">'+
            skinClothingInner()+
          '</div>'+
        '</div>'+
        '<div class="timer-display" id="sunTimerDisplay" style="font-size:38px;margin:10px 0">00:00:00</div>'+
        '<div class="vitd-box">'+
          '<div class="vitd-value" id="vitdValue">'+sunSessionVitD.toFixed(0)+'</div>'+
          '<div class="vitd-label">UI SESIÓN ACTUAL</div>'+
        '</div>'+
        '<button class="btn btn-primary" style="margin-top:10px" onclick="toggleSunTimer()">'+(sunTimerInterval?'DETENER Y GUARDAR':'INICIAR EXPOSICIÓN')+'</button>'+
        '<p style="font-size:10px;color:var(--text-dim);margin-top:8px;line-height:1.4;font-family:var(--serif);font-style:italic">Calculado según UVB, hora, clima, tipo de piel y ropa.</p>'+
        // VitD ACCUMULATED counter (day/month/year)
        '<div class="vitd-accum-card">'+
          '<div class="vitd-accum-header" onclick="toggleEstadoBlock(\'vitdAccum\')">'+
            '<span class="vitd-accum-title">📊 Vit D acumulada</span>'+
            '<button class="collapse-btn">'+(store.collapsed.vitdAccum?'▼':'▲')+'</button>'+
          '</div>'+
          '<div class="collapsible'+(store.collapsed.vitdAccum?' collapsed':'')+'">'+
            '<div class="vitd-accum-grid">'+
              '<div class="vitd-accum-cell"><div class="vitd-accum-label">HOY</div><div class="vitd-accum-val">'+Math.round(totalDay)+'</div><div class="vitd-accum-unit">IU</div></div>'+
              '<div class="vitd-accum-cell"><div class="vitd-accum-label">MES</div><div class="vitd-accum-val">'+Math.round(totalMonth)+'</div><div class="vitd-accum-unit">IU</div></div>'+
              '<div class="vitd-accum-cell"><div class="vitd-accum-label">AÑO</div><div class="vitd-accum-val">'+Math.round(totalYear)+'</div><div class="vitd-accum-unit">IU</div></div>'+
            '</div>'+
          '</div>'+
        '</div>'+
        // Estimated personal level
        '<div class="vitd-estim-card">'+
          '<div class="vitd-estim-header" onclick="toggleEstadoBlock(\'vitdEstim\')">'+
            '<span class="vitd-estim-title">🧬 Mi nivel de Vit D estimado <button class="help-icon" onclick="event.stopPropagation();showTerm(\'Vitamina D\')">?</button></span>'+
            '<button class="collapse-btn">'+(store.collapsed.vitdEstim?'▼':'▲')+'</button>'+
          '</div>'+
          '<div class="collapsible'+(store.collapsed.vitdEstim?' collapsed':'')+'">'+
            '<div style="text-align:center;padding:10px 0">'+
              '<div style="font-family:var(--display);font-size:34px;font-weight:400;color:#fbbf24;letter-spacing:-1px;font-style:italic;line-height:1">'+Math.round(estimateActual)+'</div>'+
              '<div style="font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-top:3px;font-family:var(--sans)">IU TOTALES ESTIMADOS</div>'+
            '</div>'+
            // Blood analysis equivalent conversion
            (function(){
              // Approx: serum 25(OH)D ng/ml ≈ baseline IU / 40 if user entered an analítica baseline,
              // otherwise estimate contribution: every ~100 IU/day sustained ≈ +1 ng/ml.
              const ngml=baseline>0?(baseline/40):(estimateActual/40);
              const nmol=ngml*2.5;
              let status,statusColor;
              if(ngml<20){status='Deficiencia';statusColor='#f87171';}
              else if(ngml<30){status='Insuficiencia';statusColor='#fbbf24';}
              else if(ngml<=50){status='Óptimo';statusColor='#34d399';}
              else if(ngml<=100){status='Alto';statusColor='#fbbf24';}
              else{status='Excesivo';statusColor='#f87171';}
              return '<div class="vitd-blood-card">'+
                '<div class="sub-section-label" style="margin-top:0">🩸 EQUIVALENTE EN ANALÍTICA</div>'+
                '<div style="display:flex;gap:6px;margin-top:5px">'+
                  '<div class="vitd-blood-chip"><div class="vitd-blood-val">'+ngml.toFixed(1)+'</div><div class="vitd-blood-unit">ng/ml</div></div>'+
                  '<div class="vitd-blood-chip"><div class="vitd-blood-val">'+nmol.toFixed(0)+'</div><div class="vitd-blood-unit">nmol/L</div></div>'+
                  '<div class="vitd-blood-chip" style="border-color:'+statusColor+'44"><div class="vitd-blood-val" style="font-size:13px;color:'+statusColor+'">'+status+'</div><div class="vitd-blood-unit">25(OH)D</div></div>'+
                '</div>'+
              '</div>';
            })()+
            '<div class="row-with-add" style="margin-top:8px">'+
              '<div class="input-group" style="flex:1"><label>VALOR BASE (IU)</label><input type="number" id="vitDBaselineInput" value="'+baseline+'" placeholder="0" onchange="updateVitDBaseline(this.value)"></div>'+
              '<button class="btn-mini-clear" onclick="resetVitDBaseline()" style="background:rgba(255,255,255,0.04);border-color:var(--border);color:var(--text-muted);align-self:flex-end;height:38px">Reset</button>'+
            '</div>'+
            '<p style="font-size:10px;color:var(--text-dim);margin-top:6px;line-height:1.4;font-family:var(--serif);font-style:italic">Si tienes un análisis de sangre con tu valor de 25(OH)D, introdúcelo aquí en IU (ng/ml × 40). Conversión: ng/ml × 2.5 = nmol/L. Óptimo: 30-50 ng/ml (75-125 nmol/L).</p>'+
          '</div>'+
        '</div>'+
        (store.sun.length?renderRegistros('sun','EXPOSICIONES',function(s){
          return '<div style="font-size:11.5px">'+s.duration+' · UV '+s.uv+(s.vitd?' · <strong style="color:#fbbf24">'+parseFloat(s.vitd).toFixed(0)+' IU</strong>':'')+'</div>';
        },{chartLabel:'Vit D (IU)',chartKey:'vitd',chartColor:'#fbbf24'}):'')+
      '</div>'+
    '</div>';
  }
  return '';
}

function renderSol(c){
  const lat=store.settings.lat;
  const lng=store.settings.lng;
  const times=calcSunTimes(lat,lng);
  const currentHour=sunLive?(new Date().getHours()+new Date().getMinutes()/60):sunSliderHour;
  const uv=uvIndex(currentHour,times,true);
  const uva=uvaIndex(currentHour,times,true);
  const uvb=uvbIndex(currentHour,times,true);
  const isDay=currentHour>=times.sunrise&&currentHour<=times.sunset;

  let h='<div style="display:flex;justify-content:space-between;align-items:center;width:100%">'+
    '<div class="section-title-inline" style="flex:1">SOL <span class="section-subtitle-inline">Exposición solar y vitamina D</span></div>'+
    '<button class="reorder-mini '+(solReorderMode?'active':'')+'" onclick="toggleSolReorder()" title="Reordenar bloques">'+(solReorderMode?'✓':'↕')+'</button>'+
  '</div>'+
  // SOL graph always visible
  renderSunDashboard(times,currentHour,uv,isDay);

  // Iterate ordered blocks
  store.solOrder.forEach(function(id,idx){
    const block=getSolBlock(id,times,currentHour,uv,uva,uvb,isDay);
    if(!block)return;
    if(solReorderMode){
      h+='<div class="reorder-wrap">'+
        '<div class="reorder-bar">'+
          (idx>0?'<button class="move-btn" onclick="moveSolBlock('+idx+',-1)">▲</button>':'<span style="width:30px"></span>')+
          '<span class="reorder-label">'+(idx+1)+'/'+store.solOrder.length+'</span>'+
          (idx<store.solOrder.length-1?'<button class="move-btn" onclick="moveSolBlock('+idx+',1)">▼</button>':'<span style="width:30px"></span>')+
        '</div>'+
        block+
      '</div>';
    }else{
      h+=block;
    }
  });

  c.innerHTML=h;
  if(sunLive&&window.sunRefresh)clearTimeout(window.sunRefresh);
  if(sunLive){window.sunRefresh=setTimeout(function(){if(currentTab==='sol')render();},60000);}
}

function toggleSunTimer(){
  if(sunTimerInterval){
    const duration=Math.floor((Date.now()-sunTimeStart)/1000);
    const h=Math.floor(duration/3600);
    const m=Math.floor((duration%3600)/60);
    const s=duration%60;
    const times=calcSunTimes(store.settings.lat,store.settings.lng);
    const hour=new Date().getHours()+new Date().getMinutes()/60;
    const uv=uvIndex(hour,times,true);
    store.sun.push({id:Date.now(),date:today(),duration:h+':'+m.toString().padStart(2,'0')+':'+s.toString().padStart(2,'0'),uv:uv.toFixed(1),vitd:sunSessionVitD.toFixed(0),value:parseFloat(sunSessionVitD.toFixed(0)),weather:store.settings.weather||'soleado'});
    save('sun',store.sun);
    clearInterval(sunTimerInterval);
    sunTimerInterval=null;
    sunSessionVitD=0;
    render();
  }else{
    sunTimeStart=Date.now();
    sunSessionVitD=0;
    let lastTick=Date.now();
    sunTimerInterval=setInterval(function(){
      const now=Date.now();
      const dur=Math.floor((now-sunTimeStart)/1000);
      const hh=Math.floor(dur/3600);
      const mm=Math.floor((dur%3600)/60);
      const ss=dur%60;
      const el=document.getElementById('sunTimerDisplay');
      if(el)el.textContent=hh.toString().padStart(2,'0')+':'+mm.toString().padStart(2,'0')+':'+ss.toString().padStart(2,'0');
      const times=calcSunTimes(store.settings.lat,store.settings.lng);
      const hour=new Date().getHours()+new Date().getMinutes()/60;
      const uvb=uvbIndex(hour,times,true);
      const iuPerMin=vitDPerMinute(uvb);
      const deltaSec=(now-lastTick)/1000;
      sunSessionVitD+=iuPerMin*(deltaSec/60);
      lastTick=now;
      const vd=document.getElementById('vitdValue');
      if(vd)vd.textContent=sunSessionVitD.toFixed(0);
    },1000);
    render();
  }
}

function buildExportData(){
  return {
    _meta:{app:'HEALTH',version:16,exportedAt:new Date().toISOString()},
    sleep:store.sleep,activity:store.activity,weight:store.weight,allergy:store.allergy,
    vo2max:store.vo2max,vo2history:store.vo2history,fasting:store.fasting,measurements:store.measurements,
    meditation:store.meditation,programs:store.programs,sun:store.sun,wods:store.wods,records:store.records,
    sports:store.sports,sportParams:store.sportParams,settings:store.settings,
    // ALL layout/order/position state
    widgets:store.widgets,weeklyPlan:store.weeklyPlan,activeDays:store.activeDays,
    estadoOrder:store.estadoOrder,solOrder:store.solOrder,activityOrder:store.activityOrder,panelOrder:store.panelOrder,
    lightLog:store.lightLog,
    panelCollapsed:store.panelCollapsed,collapsed:store.collapsed
  };
}
function exportData(){
  const blob=new Blob([JSON.stringify(buildExportData(),null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='health-backup-'+today()+'.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const d=JSON.parse(ev.target.result);
      Object.keys(d).forEach(function(k){
        if(k==='_meta')return;
        if(d[k]!==undefined){
          store[k]=d[k];
          if(k==='vo2max')localStorage.setItem('h_vo2max',d[k]);
          else if(k==='settings')saveSettings();
          else if(k==='widgets')saveWidgets();
          else if(k==='weeklyPlan')saveWeekly();
          else if(k==='activeDays')saveActiveDays();
          else if(k==='estadoOrder')saveEstadoOrder();
          else if(k==='solOrder')saveSolOrder();
          else if(k==='activityOrder')saveActivityOrder();
          else if(k==='panelOrder')savePanelOrder();
          else if(k==='lightLog')save('lightLog',d[k]);
          else if(k==='sportParams')saveSportParams();
          else if(k==='collapsed'||k==='panelCollapsed')saveCollapsed();
          else localStorage.setItem('h_'+k,JSON.stringify(d[k]));
        }
      });
      alert('✅ Datos importados — widgets, bloques y orden restaurados.');
      render();
    }catch(err){alert('❌ Archivo inválido');}
  };
  reader.readAsText(file);
}

function setAutoExport(mode){store.settings.autoExport=mode;saveSettings();render();}
function checkAutoExport(){
  const mode=store.settings.autoExport;
  if(!mode||mode==='off')return;
  const last=parseInt(localStorage.getItem('h_lastAutoExport')||'0');
  const now=Date.now();
  const interval=mode==='daily'?24*3600*1000:7*24*3600*1000;
  if(now-last>=interval){
    // Don't auto-download (browsers block it); remind the user
    setTimeout(function(){
      if(confirm('⏱️ Recordatorio de copia de seguridad ('+(mode==='daily'?'diaria':'semanal')+').\n\n¿Exportar tus datos ahora? Guárdalo en la misma carpeta para sobrescribir el anterior.')){
        exportData();
        localStorage.setItem('h_lastAutoExport',String(now));
      }else{
        // snooze a bit so it doesn't nag every open
        localStorage.setItem('h_lastAutoExport',String(now-interval+3600*1000));
      }
    },1500);
  }
}
function deleteAll(){
  if(!confirm('⚠️ ¿Eliminar TODOS los datos? Esta acción no se puede deshacer.'))return;
  if(!confirm('¿Estás completamente seguro?'))return;
  Object.keys(store).forEach(function(k){
    if(k!=='settings'&&k!=='widgets'&&k!=='sports'&&k!=='estadoOrder'&&k!=='collapsed'&&k!=='panelCollapsed'){
      if(Array.isArray(store[k])){store[k]=[];localStorage.removeItem('h_'+k);}
      else if(typeof store[k]==='string'){store[k]='';localStorage.removeItem('h_'+k);}
    }
  });
  store.vo2max='';localStorage.removeItem('h_vo2max');
  store.weeklyPlan={monday:{text:'',image:null},tuesday:{text:'',image:null},wednesday:{text:'',image:null},thursday:{text:'',image:null},friday:{text:'',image:null},saturday:{text:'',image:null},sunday:{text:'',image:null},calendarSync:false};
  localStorage.removeItem('h_weeklyPlan');
  store.activeDays={monday:true,tuesday:true,wednesday:true,thursday:true,friday:true,saturday:true,sunday:true};
  saveActiveDays();
  alert('✅ Todos los datos eliminados');
  render();
}

  const lastGeo=parseInt(localStorage.getItem('h_lastGeoTime')||'0');
  const geoAge=Date.now()-lastGeo;
  const hasCached=store.settings.lat&&store.settings.lng;

      navigator.geolocation.getCurrentPosition(function(pos){
        store.settings.lat=pos.coords.latitude;
        store.settings.lng=pos.coords.longitude;

        if(store.settings.autoWeather)detectWeather();
        if(currentTab==='panel'||currentTab==='sol')render();
      },function(){},{timeout:8000,maximumAge:12*3600*1000});
    }catch(e){}
  }
}

}
