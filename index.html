          ${store.records.slice().reverse().map(r=>`
            <div class="history-item">
              <div class="history-item-content">
                <div style="font-size:12.5px"><strong>${r.name}:</strong> <span style="color:var(--accent)">${r.value}</span></div>
                <div class="history-item-date">${fmtDate(r.date)}</div>
              </div>
              <button class="delete-btn" onclick="delItem('records',${r.id})">×</button>
            </div>
          `).join('')}
        </div>
      `:''}
    </div>
    ${store.activity.length?`
      <div class="card">
        <div class="card-title">Histórico</div>
        <div class="history">
          ${store.activity.slice().reverse().slice(0,30).map(a=>{const sport=store.sports.find(s=>s.id===a.type);return `
            <div class="history-item">
              <div class="history-item-content">
                <div class="history-item-date">${fmtDate(a.date)} · ${sport?sport.name:a.type}${a.subtype?' · '+a.subtype:''}</div>
                <div style="font-size:11.5px;color:#bbb">${a.duration?a.duration+'min':''}${a.result?' · '+a.result:''}${a.distance?' · '+a.distance:''}</div>
              </div>
              <button class="delete-btn" onclick="delItem('activity',${a.id})">×</button>
            </div>
          `}).join('')}
        </div>
      </div>
    `:''}
  `;
}
function setActType(t){actType=t;render();}
function addActivity(){const a={id:Date.now(),type:actType,date:document.getElementById('actDate').value,subtype:document.getElementById('actSubtype')?.value||'',duration:document.getElementById('actDuration')?.value||'',result:document.getElementById('actResult')?.value||'',distance:document.getElementById('actDistance')?.value||'',hrAvg:document.getElementById('actHRavg')?.value||'',hrMax:document.getElementById('actHRmax')?.value||'',notes:document.getElementById('actNotes')?.value||''};if(!a.date)return alert('Selecciona fecha');store.activity.push(a);save('activity',store.activity);render();}
function addWod(){const name=document.getElementById('wodName').value;const desc=document.getElementById('wodDesc').value;if(!name||!desc)return alert('Completa');store.wods.push({name,desc});save('wods',store.wods);render();}
function addRecord(){const name=document.getElementById('recName').value;const value=document.getElementById('recValue').value;const date=document.getElementById('recDate').value;if(!name||!value)return alert('Completa');store.records.push({id:Date.now(),name,value,date});save('records',store.records);render();}
function addSport(){const name=document.getElementById('newSportName').value.trim();if(!name)return alert('Pon un nombre');const id=name.toLowerCase().replace(/[^a-z0-9]/g,'_');if(store.sports.find(s=>s.id===id))return alert('Ya existe');store.sports.push({id,name});save('sports',store.sports);render();}
function delSport(id){if(!confirm('¿Eliminar este deporte?'))return;store.sports=store.sports.filter(s=>s.id!==id);save('sports',store.sports);if(actType===id)actType=store.sports[0]?.id||'crossfit';render();}
</script>
<script>
let medState='idle';
let medTimer=null;
let medTimeLeft=0;
let medConfig={total:300,inhale:4,exhale:6,countdown:3};
let medCycleTime=0;
let medCountdownVal=0;
let medOrbState='hold';

function renderMeditacion(c){
  c.innerHTML=`
    <div class="section-title">Meditación</div>
    <div class="section-subtitle">Respiración guiada</div>
    <div class="card card-glow">
      <div class="med-screen">
        <div class="breath-orb-container">
          <div class="breath-rings">
            <div class="breath-ring breath-ring-3"></div>
            <div class="breath-ring breath-ring-2"></div>
            <div class="breath-ring"></div>
          </div>
          <div class="breath-orb ${medOrbState}" id="breathOrb" style="--inhale-time:${medConfig.inhale}s;--exhale-time:${medConfig.exhale}s"></div>
          <div class="countdown-overlay" id="countdownOverlay" style="display:none"><div class="countdown-number" id="countdownNumber">3</div></div>
        </div>
        <div class="timer-display" id="medTimer">${fmtTime(medConfig.total)}</div>
        <div class="timer-phase" id="medPhase">${medState==='running'?'Comenzando...':'Listo para comenzar'}</div>
      </div>
      <div class="grid-4">
        <div class="input-group"><label>Total (s)</label><input type="number" id="medTotal" value="${medConfig.total}" onchange="updateMedConfig()"></div>
        <div class="input-group"><label>Inhalar</label><input type="number" id="medInhale" value="${medConfig.inhale}" onchange="updateMedConfig()"></div>
        <div class="input-group"><label>Exhalar</label><input type="number" id="medExhale" value="${medConfig.exhale}" onchange="updateMedConfig()"></div>
        <div class="input-group"><label>Prep (s)</label><input type="number" id="medCountdown" value="${medConfig.countdown}" min="0" max="10" onchange="updateMedConfig()"></div>
      </div>
      <div class="toggle-row" style="padding:10px 12px;background:rgba(255,255,255,0.025);border-radius:10px">
        <span class="toggle-label">🎵 Música de fondo</span>
        <div class="toggle ${store.settings.music?'active':''}" onclick="toggleMusic(this)"><div class="toggle-handle"></div></div>
      </div>
      <div class="toggle-row" style="padding:10px 12px;background:rgba(255,255,255,0.025);border-radius:10px;margin-top:6px">
        <span class="toggle-label">🔔 Campana en transición</span>
        <div class="toggle ${store.settings.transitionSound?'active':''}" onclick="toggleTransSound(this)"><div class="toggle-handle"></div></div>
      </div>
      <div class="med-controls">
        ${medState==='running'||medState==='paused'?`
          <button class="btn btn-secondary" onclick="resetMed()">⟲ Reiniciar</button>
          <button class="btn btn-primary" id="medBtn" onclick="toggleMed()">${medState==='running'?'⏸ Pausar':'▶ Reanudar'}</button>
        `:`
          <button class="btn btn-primary" id="medBtn" onclick="toggleMed()" style="flex:1">▶ Comenzar</button>
        `}
      </div>
    </div>
    <div class="card">
      <div class="card-title">💾 Programas guardados</div>
      <div class="compact-row">
        <div class="input-group" style="flex:1"><label>Nombre</label><input type="text" id="progName" placeholder="Mañana relajante"></div>
        <button class="btn btn-secondary btn-sm" onclick="saveProgram()" style="margin-bottom:0">Guardar</button>
      </div>
      ${store.programs.length?`
        <div style="margin-top:10px">
          ${store.programs.map(p=>`
            <div class="history-item">
              <div class="history-item-content" onclick="loadProgram(${p.id})" style="cursor:pointer">
                <div style="font-size:13px;font-weight:500;font-family:var(--serif);font-style:italic">${p.name}</div>
                <div class="history-item-date">${p.total}s · ${p.inhale}/${p.exhale}</div>
              </div>
              <button class="delete-btn" onclick="delItem('programs',${p.id})">×</button>
            </div>
          `).join('')}
        </div>
      `:''}
    </div>
    ${store.meditation.length?`
      <div class="card">
        <div class="card-title">Sesiones recientes</div>
        <div class="history">
          ${store.meditation.slice().reverse().slice(0,15).map(m=>`
            <div class="history-item">
              <div class="history-item-content">
                <div class="history-item-date">${fmtDate(m.date)}</div>
                <div style="font-size:11.5px">${m.duration}s · Inh ${m.inhale}s / Exh ${m.exhale}s</div>
              </div>
              <button class="delete-btn" onclick="delItem('meditation',${m.id})">×</button>
            </div>
          `).join('')}
        </div>
      </div>
    `:''}
  `;
}
function fmtTime(s){const m=Math.floor(s/60);const sec=s%60;return `${m}:${sec.toString().padStart(2,'0')}`;}
function updateMedConfig(){
  medConfig.total=parseInt(document.getElementById('medTotal').value)||300;
  medConfig.inhale=parseInt(document.getElementById('medInhale').value)||4;
  medConfig.exhale=parseInt(document.getElementById('medExhale').value)||6;
  medConfig.countdown=parseInt(document.getElementById('medCountdown').value)||0;
  document.getElementById('medTimer').textContent=fmtTime(medConfig.total);
  const orb=document.getElementById('breathOrb');
  if(orb){orb.style.setProperty('--inhale-time',medConfig.inhale+'s');orb.style.setProperty('--exhale-time',medConfig.exhale+'s');}
}
function toggleMed(){
  // FIX iOS: unlock audio first then start
  unlockAudio().then(()=>{
    if(medState==='idle'){
      if(medConfig.countdown>0){startCountdown();}
      else{startMeditation();}
    }else if(medState==='running'){pauseMeditation();}
    else if(medState==='paused'){resumeMeditation();}
  }).catch(()=>{
    if(medState==='idle'){if(medConfig.countdown>0)startCountdown();else startMeditation();}
    else if(medState==='running')pauseMeditation();
    else if(medState==='paused')resumeMeditation();
  });
}
function startCountdown(){
  medState='countdown';
  medCountdownVal=medConfig.countdown;
  const overlay=document.getElementById('countdownOverlay');
  const num=document.getElementById('countdownNumber');
  if(overlay){overlay.style.display='flex';num.textContent=medCountdownVal;}
  const phase=document.getElementById('medPhase');
  if(phase){phase.textContent='Preparándose...';phase.classList.remove('active');}
  playChime(0.3);
  medTimer=setInterval(()=>{
    medCountdownVal--;
    if(medCountdownVal<=0){
      clearInterval(medTimer);
      if(overlay)overlay.style.display='none';
      startMeditation();
    }else{
      if(num){num.textContent=medCountdownVal;num.style.animation='none';void num.offsetWidth;num.style.animation='countPulse 1s ease';}
      playChime(0.25);
    }
  },1000);
}
function startMeditation(){
  medState='running';
  medTimeLeft=medConfig.total;
  medCycleTime=0;
  medOrbState='inhale';
  if(store.settings.music)startBgMusic();
  playBell(0.45);
  const orb=document.getElementById('breathOrb');
  if(orb){orb.classList.remove('hold','exhale');void orb.offsetWidth;orb.classList.add('inhale');}
  const phase=document.getElementById('medPhase');
  if(phase){phase.textContent=`Inhala (${medConfig.inhale}s)`;phase.classList.add('active');}
  render();
  medTimer=setInterval(medTick,1000);
}
function medTick(){
  medTimeLeft--;
  medCycleTime++;
  const cycle=medConfig.inhale+medConfig.exhale;
  const inCycle=medCycleTime%cycle;
  const phaseEl=document.getElementById('medPhase');
  const orb=document.getElementById('breathOrb');
  if(inCycle===1&&medCycleTime>1){
    if(orb){orb.classList.remove('exhale','hold');void orb.offsetWidth;orb.classList.add('inhale');}
    if(phaseEl)phaseEl.textContent=`Inhala (${medConfig.inhale}s)`;
    if(store.settings.transitionSound)playChime(0.3);
  }else if(inCycle===medConfig.inhale+1){
    if(orb){orb.classList.remove('inhale','hold');void orb.offsetWidth;orb.classList.add('exhale');}
    if(phaseEl)phaseEl.textContent=`Exhala (${medConfig.exhale}s)`;
    if(store.settings.transitionSound)playChimeLow(0.3);
  }
  document.getElementById('medTimer').textContent=fmtTime(medTimeLeft);
  if(medTimeLeft<=0)finishMeditation();
}
function pauseMeditation(){
  medState='paused';
  clearInterval(medTimer);
  stopBgMusic();
  const phase=document.getElementById('medPhase');
  if(phase){phase.textContent='⏸ Pausado';phase.classList.remove('active');}
  const orb=document.getElementById('breathOrb');
  if(orb){orb.classList.remove('inhale','exhale');orb.classList.add('hold');}
  render();
}
function resumeMeditation(){
  medState='running';
  if(store.settings.music)startBgMusic();
  const orb=document.getElementById('breathOrb');
  if(orb){const cycle=medConfig.inhale+medConfig.exhale;const inCycle=medCycleTime%cycle;orb.classList.remove('hold');if(inCycle<=medConfig.inhale){orb.classList.add('inhale');}else{orb.classList.add('exhale');}}
  medTimer=setInterval(medTick,1000);
  render();
}
function resetMed(){
  clearInterval(medTimer);
  stopBgMusic();
  medState='idle';
  medTimeLeft=medConfig.total;
  medCycleTime=0;
  medOrbState='hold';
  const overlay=document.getElementById('countdownOverlay');
  if(overlay)overlay.style.display='none';
  render();
}
function finishMeditation(){
  clearInterval(medTimer);
  stopBgMusic();
  playBell(0.5);
  setTimeout(()=>playBell(0.3),900);
  medState='idle';
  const phase=document.getElementById('medPhase');
  if(phase){phase.textContent='✨ Sesión completa';phase.classList.add('active');}
  const orb=document.getElementById('breathOrb');
  if(orb){orb.classList.remove('inhale','exhale');orb.classList.add('hold');}
  store.meditation.push({id:Date.now(),date:today(),duration:medConfig.total,inhale:medConfig.inhale,exhale:medConfig.exhale});
  save('meditation',store.meditation);
  setTimeout(()=>{if(currentTab==='meditacion')render();},2000);
}
function toggleMusic(el){store.settings.music=!store.settings.music;el.classList.toggle('active');saveSettings();if(store.settings.music&&medState==='running')startBgMusic();else if(!store.settings.music)stopBgMusic();}
function toggleTransSound(el){store.settings.transitionSound=!store.settings.transitionSound;el.classList.toggle('active');saveSettings();}
function saveProgram(){const name=document.getElementById('progName').value;if(!name)return alert('Pon nombre');store.programs.push({id:Date.now(),name,...medConfig});save('programs',store.programs);render();}
function loadProgram(id){const p=store.programs.find(x=>x.id===id);if(!p)return;medConfig={total:p.total,inhale:p.inhale,exhale:p.exhale,countdown:p.countdown||3};render();}
</script>
<script>
let sunTimerInterval=null;
let sunTimeStart=null;
let sunSessionVitD=0;

function renderSol(c){
  const lat=store.settings.lat;
  const lng=store.settings.lng;
  const times=calcSunTimes(lat,lng);
  const currentHour=sunLive?(new Date().getHours()+new Date().getMinutes()/60):sunSliderHour;
  const uv=uvIndex(currentHour,times,true);
  const uva=uvaIndex(currentHour,times,true);
  const uvb=uvbIndex(currentHour,times,true);
  const isDay=currentHour>=times.sunrise&&currentHour<=times.sunset;
  c.innerHTML=`
    <div class="section-title">Sol</div>
    <div class="section-subtitle">Exposición solar y vitamina D</div>
    ${renderSunDashboard(times,currentHour,uv,isDay)}

    <div class="card">
      <div class="card-title">🌤️ Condiciones climáticas</div>
      <div class="weather-tabs">
        ${Object.entries(WEATHER_PRESETS).map(([k,w])=>`<button class="weather-tab ${(store.settings.weather||'soleado')===k?'active':''}" onclick="setWeather('${k}')"><span>${w.icon}</span>${w.name}</button>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">
        <div style="background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.2);border-radius:10px;padding:8px;text-align:center">
          <div style="font-size:9px;color:#60a5fa;text-transform:uppercase;letter-spacing:1px;font-weight:600">UVA actual</div>
          <div style="font-family:var(--serif);font-size:22px;font-weight:500;color:#60a5fa;font-style:italic;margin-top:2px">${uva.toFixed(1)}</div>
        </div>
        <div style="background:rgba(168,85,247,0.08);border:1px solid rgba(168,85,247,0.2);border-radius:10px;padding:8px;text-align:center">
          <div style="font-size:9px;color:#c084fc;text-transform:uppercase;letter-spacing:1px;font-weight:600">UVB actual</div>
          <div style="font-family:var(--serif);font-size:22px;font-weight:500;color:#c084fc;font-style:italic;margin-top:2px">${uvb.toFixed(1)}</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">🎚️ Explorar hora</div>
      <div style="text-align:center;font-family:var(--display);font-size:24px;font-weight:400;color:var(--accent);margin-bottom:8px;font-style:italic">${fmtHour(currentHour)}</div>
      <input type="range" min="0" max="24" step="0.25" value="${currentHour}" id="sunSlider" oninput="updateSunSlider(this.value)">
      <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text-dim);margin-top:5px;font-family:var(--sans)">
        <span>00</span><span>06</span><span>12</span><span>18</span><span>24</span>
      </div>
      ${!sunLive?`<button class="btn btn-tertiary btn-sm" style="width:100%;margin-top:10px" onclick="resetSunLive()">⚡ Volver a EN VIVO</button>`:''}
      <div style="font-size:10px;color:var(--text-dim);text-align:center;margin-top:8px;font-family:var(--serif);font-style:italic">💡 Arrastra el sol en el gráfico</div>
    </div>

    <div class="card">
      <div class="card-title">⚙️ Visualización</div>
      <div class="toggle-row" style="padding:6px 0">
        <span class="toggle-label">🎨 Efectos de color del cielo</span>
        <div class="toggle ${store.settings.sunEffects?'active':''}" onclick="toggleSunEffects(this)"><div class="toggle-handle"></div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📍 Ubicación</div>
      <div class="toggle-row" style="padding:0 0 8px">
        <span class="toggle-label">Geolocalización automática</span>
        <div class="toggle ${store.settings.autoLocation?'active':''}" onclick="toggleAutoLoc(this)"><div class="toggle-handle"></div></div>
      </div>
      ${!store.settings.autoLocation?`
        <div class="grid-2">
          <div class="input-group"><label>Latitud</label><input type="number" step="0.0001" id="manLat" value="${store.settings.lat}" onchange="updateManLoc()"></div>
          <div class="input-group"><label>Longitud</label><input type="number" step="0.0001" id="manLng" value="${store.settings.lng}" onchange="updateManLoc()"></div>
        </div>
      `:''}
      <div style="font-size:11px;color:var(--text-dim);text-align:center;margin-top:6px;font-family:var(--sans)">📍 ${lat.toFixed(4)}°, ${lng.toFixed(4)}°</div>
    </div>

    <div class="card">
      <div class="card-title">🧬 Ventanas de Leptina</div>
      <p style="font-size:11px;color:var(--text-muted);margin-bottom:8px;line-height:1.5;font-family:var(--sans)">La leptina (saciedad) sigue al sol. Comer en la ventana óptima mejora regulación hormonal.</p>
      <div class="data-row"><span class="data-label">📈 Pico leptina (comida principal)</span><span class="data-value" style="color:var(--accent)">${fmtHour(times.noon)}</span></div>
      <div class="data-row"><span class="data-label">🛑 Última comida ideal</span><span class="data-value" style="color:#fb923c">${fmtHour(times.noon+4)}</span></div>
    </div>

    <div class="card">
      <div class="card-title">⏱️ Cronómetro de exposición</div>
      <div class="timer-display" id="sunTimerDisplay" style="font-size:38px;margin:10px 0">00:00:00</div>
      <div class="vitd-box">
        <div class="vitd-value" id="vitdValue">${sunSessionVitD.toFixed(0)}</div>
        <div class="vitd-label">UI Vitamina D estimada</div>
      </div>
      <button class="btn btn-primary" style="margin-top:10px" onclick="toggleSunTimer()">${sunTimerInterval?'Detener y guardar':'Iniciar exposición'}</button>
      <p style="font-size:10px;color:var(--text-dim);margin-top:8px;line-height:1.4;font-family:var(--serif);font-style:italic">Calculado en función de UVB actual, hora y clima. Asume piel media con brazos/cara descubiertos.</p>
      ${store.sun.length?`
        <div class="divider"></div>
        <div class="card-title">Registros</div>
        <div class="history">
          ${store.sun.slice().reverse().slice(0,10).map(s=>`
            <div class="history-item">
              <div class="history-item-content">
                <div class="history-item-date">${fmtDate(s.date)}</div>
                <div style="font-size:11.5px">${s.duration} · UV ${s.uv}${s.vitd?` · <strong style="color:#fbbf24">${parseFloat(s.vitd).toFixed(0)} IU</strong>`:''}</div>
              </div>
              <button class="delete-btn" onclick="delItem('sun',${s.id})">×</button>
            </div>
          `).join('')}
        </div>
      `:''}
    </div>
  `;
  if(sunLive&&window.sunRefresh)clearTimeout(window.sunRefresh);
  if(sunLive){window.sunRefresh=setTimeout(()=>{if(currentTab==='sol')render();},60000);}
}
function setWeather(w){store.settings.weather=w;saveSettings();render();}
function toggleAutoLoc(el){store.settings.autoLocation=!store.settings.autoLocation;el.classList.toggle('active');saveSettings();if(store.settings.autoLocation&&navigator.geolocation){navigator.geolocation.getCurrentPosition(pos=>{store.settings.lat=pos.coords.latitude;store.settings.lng=pos.coords.longitude;saveSettings();render();});}else render();}
function updateManLoc(){store.settings.lat=parseFloat(document.getElementById('manLat').value);store.settings.lng=parseFloat(document.getElementById('manLng').value);saveSettings();render();}
function updateSunSlider(val){sunSliderHour=parseFloat(val);sunLive=false;render();}
function toggleSunEffects(el){store.settings.sunEffects=!store.settings.sunEffects;el.classList.toggle('active');saveSettings();render();}

function toggleSunTimer(){
  if(sunTimerInterval){
    const duration=Math.floor((Date.now()-sunTimeStart)/1000);
    const h=Math.floor(duration/3600);
    const m=Math.floor((duration%3600)/60);
    const s=duration%60;
    const times=calcSunTimes(store.settings.lat,store.settings.lng);
    const hour=new Date().getHours()+new Date().getMinutes()/60;
    const uv=uvIndex(hour,times,true);
    store.sun.push({id:Date.now(),date:today(),duration:`${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`,uv:uv.toFixed(1),vitd:sunSessionVitD.toFixed(0),weather:store.settings.weather||'soleado'});
    save('sun',store.sun);
    clearInterval(sunTimerInterval);
    sunTimerInterval=null;
    sunSessionVitD=0;
    render();
  }else{
    sunTimeStart=Date.now();
    sunSessionVitD=0;
    let lastTick=Date.now();
    sunTimerInterval=setInterval(()=>{
      const now=Date.now();
      const dur=Math.floor((now-sunTimeStart)/1000);
      const h=Math.floor(dur/3600);
      const m=Math.floor((dur%3600)/60);
      const s=dur%60;
      const el=document.getElementById('sunTimerDisplay');
      if(el)el.textContent=`${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
      // Calculate vit D for elapsed second
      const times=calcSunTimes(store.settings.lat,store.settings.lng);
      const hour=new Date().getHours()+new Date().getMinutes()/60;
      const uvb=uvbIndex(hour,times,true);
      const iuPerMin=vitDPerMinute(uvb);
      const deltaSec=(now-lastTick)/1000;
      sunSessionVitD+=iuPerMin*(deltaSec/60);
      lastTick=now;
      const vd=document.getElementById('vitdValue');
      if(vd)vd.textContent=sunSessionVitD.toFixed(0);
    },1000);
    render();
  }
}

function renderAjustes(c){
  c.innerHTML=`
    <div class="section-title">Ajustes</div>
    <div class="section-subtitle">Configuración y datos</div>
    <div class="card">
      <div class="card-title">💾 Datos</div>
      <button class="btn btn-primary" onclick="exportData()" style="margin-bottom:6px">📤 Exportar datos</button>
      <label class="btn btn-secondary" style="display:block;text-align:center;cursor:pointer;margin-bottom:6px">📥 Importar datos<input type="file" accept=".json" style="display:none" onchange="importData(event)"></label>
      <button class="btn btn-danger" onclick="deleteAll()">🗑️ Eliminar todos los datos</button>
    </div>
    <div class="card">
      <div class="card-title">📍 Ubicación</div>
      <div class="toggle-row" style="padding:0 0 6px">
        <span class="toggle-label">Geolocalización automática</span>
        <div class="toggle ${store.settings.autoLocation?'active':''}" onclick="toggleAutoLoc(this)"><div class="toggle-handle"></div></div>
      </div>
      ${!store.settings.autoLocation?`
        <div class="grid-2">
          <div class="input-group"><label>Latitud</label><input type="number" step="0.0001" value="${store.settings.lat}" id="setLat" onchange="store.settings.lat=parseFloat(this.value);saveSettings()"></div>
          <div class="input-group"><label>Longitud</label><input type="number" step="0.0001" value="${store.settings.lng}" id="setLng" onchange="store.settings.lng=parseFloat(this.value);saveSettings()"></div>
        </div>
      `:''}
    </div>
    <div class="card">
      <div class="card-title">📊 Resumen</div>
      <div class="data-row"><span class="data-label">Sueño</span><span class="data-value">${store.sleep.length} registros</span></div>
      <div class="data-row"><span class="data-label">Actividad</span><span class="data-value">${store.activity.length} entrenos</span></div>
      <div class="data-row"><span class="data-label">Peso</span><span class="data-value">${store.weight.length} registros</span></div>
      <div class="data-row"><span class="data-label">Ayunos</span><span class="data-value">${store.fasting.length} registros</span></div>
      <div class="data-row"><span class="data-label">Medidas</span><span class="data-value">${store.measurements.length} registros</span></div>
      <div class="data-row"><span class="data-label">Alergia</span><span class="data-value">${store.allergy.length} registros</span></div>
      <div class="data-row"><span class="data-label">Meditación</span><span class="data-value">${store.meditation.length} sesiones</span></div>
      <div class="data-row"><span class="data-label">Sol</span><span class="data-value">${store.sun.length} registros</span></div>
      <div class="data-row"><span class="data-label">Marcas</span><span class="data-value">${store.records.length} records</span></div>
      <div class="data-row"><span class="data-label">Deportes</span><span class="data-value">${store.sports.length}</span></div>
    </div>
    <div class="card">
      <div class="card-title">ℹ️ Sobre HEALTH</div>
      <div style="font-size:12px;color:#999;line-height:1.65;font-family:var(--sans)">Aplicación integral de salud personal. Todos los datos se guardan localmente en tu dispositivo. 100% privado, sin servidores, funciona offline.<br><br><span style="font-family:var(--serif);font-style:italic;color:var(--accent);font-size:14px">Versión 6.0</span></div>
    </div>
  `;
}
function exportData(){const data={sleep:store.sleep,activity:store.activity,weight:store.weight,allergy:store.allergy,vo2max:store.vo2max,fasting:store.fasting,measurements:store.measurements,meditation:store.meditation,programs:store.programs,sun:store.sun,wods:store.wods,records:store.records,sports:store.sports,settings:store.settings,widgets:store.widgets,weeklyPlan:store.weeklyPlan};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`health-backup-${today()}.json`;a.click();URL.revokeObjectURL(url);}
function importData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const d=JSON.parse(ev.target.result);Object.keys(d).forEach(k=>{if(d[k]!==undefined){store[k]=d[k];if(k==='vo2max')localStorage.setItem('h_vo2max',d[k]);else if(k==='settings')saveSettings();else if(k==='widgets')saveWidgets();else localStorage.setItem('h_'+k,JSON.stringify(d[k]));}});alert('✅ Datos importados');render();}catch(err){alert('❌ Archivo inválido');}};reader.readAsText(file);}
function deleteAll(){if(!confirm('⚠️ ¿Eliminar TODOS los datos? Esta acción no se puede deshacer.'))return;if(!confirm('¿Estás completamente seguro?'))return;Object.keys(store).forEach(k=>{if(k!=='settings'&&k!=='widgets'&&k!=='sports'){store[k]=Array.isArray(store[k])?[]:'';localStorage.removeItem('h_'+k);}});alert('✅ Todos los datos eliminados');render();}

if(navigator.geolocation&&store.settings.autoLocation){navigator.geolocation.getCurrentPosition(pos=>{store.settings.lat=pos.coords.latitude;store.settings.lng=pos.coords.longitude;saveSettings();if(currentTab==='panel'||currentTab==='sol')render();});}
render();
</script>
</body>
</html>
